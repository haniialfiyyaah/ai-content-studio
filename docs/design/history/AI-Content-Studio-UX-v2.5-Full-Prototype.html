const navContent=(drawer=false)=>`<div class="brand"><span class="logo">✦</span><div><strong>AI Content<br>Studio</strong><small>CREATIVE WORKSPACE</small></div></div><button class="nav-cta" data-action="new-chat">✦ &nbsp; Create with AI</button><div class="nav-group">Workspace</div>${nav.slice(0,4).map(([id,i,name])=>`<button class="nav-item ${S.page===id?'active':''}" data-go="${id}"><span class="ni">${i}</span>${name}</button>`).join('')}<div class="nav-group">Manage</div>${nav.slice(4).map(([id,i,name])=>`<button class="nav-item ${S.page===id?'active':''}" data-go="${id}"><span class="ni">${i}</span>${name}</button>`).join('')}<div class="nav-note"><b>Prototype v2.5</b><br>All actions are local simulations. No AI, billing, rendering or publishing is connected.</div><div class="nav-bottom"><span class="avatar">HA</span><div><b style="font-size:11px">Studio owner</b><small style="display:block;font-size:10px;margin-top:4px">Personal workspace</small></div></div>`;
function shell(body,focus=false){const crumb=({overview:'Overview',agent:'Creative Workspace',projects:'Projects',project:'Affiliate Products',content:'Content',editor:'Content Editor',production:'Production Studio',videos:'Videos',video:'Video Review',publishing:'Publishing',composer:'Schedule Post',automation:'Automation',runs:'Execution History',library:'Asset Library',settings:'Settings'}[S.page]||'Workspace');return `<div class="shell ${focus?'workspace-shell':''} ${S.navCollapsed?'nav-collapsed':''}">${focus?'':`<nav class="nav">${navContent()}</nav>`}<main class="main"><div class="top"><div class="top-left"><button class="iconbtn" data-action="toggle-nav" aria-label="${focus?'Open navigation':S.navCollapsed?'Show sidebar':'Hide sidebar'}" title="${focus?'Open navigation':S.navCollapsed?'Show sidebar':'Hide sidebar'}">☰</button>${focus?'<span class="topbrand">✦ &nbsp;AI Content Studio</span>':`<span class="crumb">Studio &nbsp;/&nbsp; <b>${crumb}</b></span>`}</div><div class="top-right">${focus?tag(S.projectReady?S.project.name:'Creative Agent','gray'):tag('UX v2.5','gray')}<span class="minor" style="color:#a8a3b3">Interactive prototype</span>${btn(focus?'← Overview':'✦ Agent',focus?'go-overview':'open-agent','sm soft')}</div></div>${body}</main></div>`;}
const pageWrap=(x)=>`<div class="page"><div class="wide">${x}</div></div>`;
function agentStart(){return `<div class="agent-start"><div class="hero"><div class="hero-mark">✦</div><div class="eyebrow">Your ideas, in motion</div><h1>What would you like<br><span>to create today?</span></h1><p>Bring a rough idea, a product photo, or just a goal. Your creative agent will shape it into a Project, content plan and automation proposal.</p><div class="chatcomposer"><textarea id="start-msg" placeholder="Example: I want to create content for affiliate products. Help me plan it..."></textarea><div class="composefoot"><button class="btn sm" data-action="attach">＋ &nbsp; Add references</button><button class="btn primary" data-action="send-start">Send &nbsp; ↗</button></div></div><div class="suggestions">${starterIdeas.map(s=>`<button class="suggestion" data-prompt="${esc(s)}">${esc(s)}</button>`).join('')}</div><p style="font-size:10px;color:#aaa6b5;margin-top:20px">The first message starts Project planning automatically · No setup wizard</p></div></div>`;}
function chatPanel(){return `<div class="chatpanel ${S.mobileSide==='review'?'mobile-hidden':''}"><div class="panelhead"><span style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:850"><span class="logo" style="width:27px;height:27px;font-size:17px;border-radius:8px">✦</span> Creative Agent</span>${tag('Same Project context','gray')}</div><div class="thread" id="thread">${S.conversation.map(m=>`<div><div class="msglabel" style="text-align:${m.who==='user'?'right':'left'}">${m.who==='user'?'You':'AI Agent'}</div><div class="bubble ${m.who==='user'?'user':'agent'}">${esc(m.text).replaceAll('\n','<br>')}</div></div>`).join('')}${S.agentStage==='planning'?`<div><div class="msglabel">AI Agent</div><div class="bubble agent">Preparing your Project plan <span style="color:#745dd1">●●●</span></div></div>`:''}</div><div class="inputdock"><textarea id="chat-msg" placeholder="Ask the agent to change anything..."></textarea><div class="row between" style="margin-top:8px"><span class="tiny">Suggestions update the Project draft</span><button class="btn primary sm" data-action="send-chat">Send ↗</button></div></div></div>`;}
function projectProgress(){const steps=['Understanding the idea','Exploring content directions','Preparing the Creative Kit','Drafting the content plan','Suggesting automation settings'];return `<div class="panelhead"><b style="font-size:13px">Preparing your Project</b>${tag('AI planning')}</div><div class="panel-body"><div class="eyebrow">Step ${Math.min(S.progress+1,5)} of 5</div><h2 style="font-size:22px;margin:9px 0">Your Project is taking shape</h2><p class="tiny">This preview simulates stage-by-stage updates. Real progress should come from n8n execution events.</p><div class="progress">${steps.map((st,i)=>`<div class="progress-step ${i<S.progress?'done':i===S.progress?'current':''}"><span class="progress-dot">${i<S.progress?'✓':i===S.progress?'✦':i+1}</span>${st}</div>`).join('')}</div><div class="summarybox"><b style="font-size:12px">Live preview</b>${S.progress>1?`<p>Project direction · ${esc(S.project.name)}</p>`:'<div class="skeleton" style="width:90%"></div>'}${S.progress>2?'<p>Creative Kit · Playful, Indonesian, practical products</p>':'<div class="skeleton" style="width:70%"></div>'}${S.progress>3?'<p>Content ideas · 5 draft concepts</p>':'<div class="skeleton" style="width:82%"></div>'}</div></div><div class="panel-footer"><span class="tiny">You can keep chatting. Planning is not activation.</span>${btn('View overview','go-overview','sm')}</div>`;}
function kit(){return `<div class="block"><div class="row between"><div><b style="font-size:13px">Creative Kit</b><p class="tiny" style="margin-top:5px">${esc(S.project.tone)} · ${esc(S.project.audience)} · ${esc(S.project.language)} · ${esc(S.project.structure)}</p></div><button class="btn sm" data-action="toggle-kit">${S.project.kitOpen?'Collapse':'Customize'} &nbsp;⌄</button></div>${S.project.kitOpen?`<div class="formgrid" style="margin-top:16px">${selectField('Tone','tone',['Playful','Witty','Professional','Calm','Energetic','Educational'])}${selectField('Audience','audience',['Young adults','General audience','Pet owners','Parents','Professionals','Students'])}${selectField('Content objective','objective',['Promote','Entertain','Educate','Inspire','Engage'])}${selectField('Content structure','structure',['Independent','Connected series'])}${selectField('Language','language',['Indonesian','English'])}${selectField('Visual style','visual',['Illustrated & motion','Minimal editorial','Cinematic','Product showcase','2D animation'])}</div><div class="field" style="margin-top:13px"><label>Additional creative direction (optional)</label><textarea data-setting="direction">${esc(S.project.direction)}</textarea></div>`:''}</div>`;}
function selectField(label,key,opts){return `<div class="field"><label>${label}</label><select data-setting="${key}">${opts.map(o=>`<option ${S.project[key]===o?'selected':''}>${o}</option>`).join('')}</select></div>`;}
function projectContent(compact=false){return `<div class="block"><div class="sectionhead"><div><h2>Content plan</h2><p>${S.concepts.length} ideas prepared · review or edit before production</p></div>${btn('＋ Add','add-concept','sm soft')}</div>${S.concepts.slice(0,compact?4:99).map(c=>`<div class="concept-item"><span class="num">${String(c.id).padStart(2,'0')}</span><div style="flex:1;min-width:0"><button class="linkbtn" data-action="open-concept" data-id="${c.id}">${esc(c.title)}</button><div class="tiny">${esc(c.summary)}</div></div>${tag(c.approved?'Approved':'Draft',c.approved?'green':'gray')}</div>`).join('')}${compact&&S.concepts.length>4?`<button class="btn link sm" data-action="show-all-content">View all ${S.concepts.length} concepts →</button>`:''}</div>`;}
function automationSection(){return `<div class="block"><div class="sectionhead"><div><h2>Automation plan</h2><p>Proposed by the agent · editable before activation</p></div>${tag(S.project.status==='draft'?'Not active':S.project.status,S.project.status==='active'?'green':'gray')}</div><div class="setting-row"><div><b style="font-size:12px">Recurring ideation</b><p class="tiny">Suggest new concepts ${esc(S.project.days)} · ${esc(S.project.time)}</p></div><input type="checkbox" class="toggle" data-toggle="ideation" ${S.project.ideation?'checked':''}></div><div class="setting-row"><div><b style="font-size:12px">Scheduled publishing</b><p class="tiny">Requires a connected channel and approved video</p></div><input type="checkbox" class="toggle" data-toggle="publishing" ${S.project.publishing?'checked':''}></div><div class="row between" style="margin-top:12px">${btn('Edit schedule','edit-schedule','sm')}<span class="tiny">Automation activation ≠ content approval</span></div></div>`;}
function initialLaunch(){return S.concepts.filter(c=>c.launch!==false);}
function reviewReady(){return !!S.setupReviewed && initialLaunch().length>0 && initialLaunch().every(c=>c.approved);}
function reviewStepper(){const options=[['setup','1','Project setup','Creative Kit & automation'],['content','2','Content & scenes','Review each launch concept'],['activate','3','Activation','Authorize workflows']];return `<div class="step-rail">${options.map(([id,n,title,subtitle])=>`<button class="step-button ${S.reviewStep===id?'active':''} ${id==='setup'&&S.setupReviewed||id==='content'&&initialLaunch().every(c=>c.approved)?'done':''}" data-action="review-step" data-step="${id}"><span class="step-index">${id==='setup'&&S.setupReviewed||id==='content'&&initialLaunch().every(c=>c.approved)?'✓':n}</span><span style="min-width:0"><b>${title}</b><small>${subtitle}</small></span></button>`).join('')}</div>`;}
function reviewProjectSetup(){return `<div class="review-hero"><div class="eyebrow">Step 1 · Project setup</div><div class="row between" style="align-items:start"><div><h2>${esc(S.project.name)}</h2><p>${esc(S.project.goal)}</p></div>${btn('✎ Edit','edit-project','sm')}</div></div><div class="review-section" style="background:#faf9fd"><div class="row between"><b>What the agent prepared</b>${tag('Editable proposal')}</div><p>One Project to organize your content ideas, visual direction, production defaults, and automation. The Creative Kit starts with suggested values.</p></div>${kit()}${automationSection()}<div class="review-section"><b>Initial content plan</b><p>${S.concepts.length} concepts proposed · ${initialLaunch().length} selected for launch. You'll review scripts, scenes and assets in the next step.</p></div>`;}
function sceneData(c){const title=c.title.toLowerCase();if(title.includes('cat'))return [['01','Introduce the character','Establish a playful setting and main character.','🐈'],['02','Story moment','Character reacts with expressive motion and comedic timing.','✦'],['03','Payoff','Finish the scene with a visual punchline.','★']];return [['01','Opening hook','Express the problem using dynamic layered graphics.','✳'],['02','Main story / reveal','Show supporting visuals or product references with motion.','✦'],['03','Closing frame','Reinforce the message with a clear ending or CTA.','↗']];}
function reviewContent(){const c=getC(S.activeConcept)||S.concepts[0];const reviewed=S.concepts.filter(x=>x.approved&&x.launch!==false).length;const eligible=initialLaunch().length;return `<div class="content-review-head"><div><div class="eyebrow">Step 2 · Content review</div><h2 class="review-headline" style="margin:0">Scripts, scenes and storyboards</h2><p class="tiny">Review the actual creative plan—not only a concept title.</p></div><span class="review-counter">${reviewed} / ${eligible} approved</span></div><div class="review-list">${S.concepts.map(x=>`<button class="review-concept ${x.id===c.id?'active':''}" data-action="select-review-concept" data-id="${x.id}"><span class="review-small">CONCEPT ${String(x.id).padStart(2,'0')}</span><b>${esc(x.title)}</b>${tag(x.launch===false?'Not for launch':x.approved?'Approved':'Needs review',x.launch===false?'gray':x.approved?'green':'amber')}</button>`).join('')}</div><div class="divider"></div><div class="row between" style="margin-top:15px;align-items:start;gap:12px"><div><span class="stage-meta">Concept ${String(c.id).padStart(2,'0')} · Version ${c.version}</span><h2 class="review-headline">${esc(c.title)}</h2><p class="tiny">${esc(c.summary)}</p></div>${tag(c.approved?'Approved':'Draft',c.approved?'green':'gray')}</div><div class="launch-control" style="margin-top:12px"><input id="launch-toggle" type="checkbox" ${c.launch===false?'':'checked'} data-action="noop"><div><b>Include in initial launch</b><div class="tiny">Uncheck to keep this idea as a draft. Only selected concepts must be approved before activation.</div></div></div><div class="preview-tabs">${[['storyboard','Storyboard'],['script','Script & narration'],['pack','Publishing Pack'],['history','Versions']].map(([id,t])=>`<button data-editor-tab="${id}" class="${S.editorTab===id?'active':''}">${t}</button>`).join('')}</div>${S.conceptEditing?`<div class="stack"><div class="field"><label>Concept title</label><input id="review-concept-title" value="${esc(c.title)}"></div><div class="field"><label>Concept direction / script brief</label><textarea id="review-concept-summary">${esc(c.summary)}</textarea></div><div class="review-banner">Saving creates a new draft version of this concept. Older approvals and video attempts remain associated with their original versions.</div></div>`:S.editorTab==='storyboard'?`<div class="scene-strip">${sceneData(c).map(([n,title,detail,emoji])=>`<div class="scene-card"><div class="scene-art"><strong>${emoji}</strong></div><div class="scene-detail"><b>${n} · ${title}</b><small>${detail}</small></div></div>`).join('')}</div><div class="review-section"><b>Visual production notes</b><p>Scenes combine verified references, deliberate motion, layout, readable text, narration and timing. The final renderer is selected after concept approval.</p></div>`:S.editorTab==='script'?`<div class="review-section"><b>Opening hook</b><p>${esc(c.hook||'A relatable opening that immediately communicates the idea.')}</p></div><div class="review-section"><b>Script & narration</b><p>${esc(c.script||c.summary+' Narration follows the selected language and creative direction; scene timing is finalized with audio.')}</p></div>`:S.editorTab==='pack'?`<div class="review-section"><b>YouTube / publishing title</b><p>${esc(c.title)}</p></div><div class="review-section"><b>Caption and hashtags</b><p>${esc(c.summary)} · #ContentIdeas #CreativeStudio</p></div>`:`<div class="review-section"><b>Revision history</b><p>Working version v${c.version}. Approved snapshots are immutable. Editing after approval creates the next draft version.</p></div>`}<div class="review-buttons" style="margin-top:17px">${S.conceptEditing?`${btn('Cancel edit','cancel-review-edit')}${btn('Save new draft version','save-review-edit','primary')}`:`${btn('✎ Edit concept','edit-review-concept')}${c.launch===false?'':c.approved?tag('Approved ✓','green'):btn('✓ Approve concept','approve-review-concept','primary')}${btn('＋ Add concept','add-review-concept','sm soft')}`}</div>`;}
function reviewActivation(){const list=initialLaunch(),approved=list.filter(c=>c.approved).length,ready=reviewReady(),st=S.project.status;return `<div class="eyebrow">Step 3 · Final review</div><div class="review-hero"><h2>${st==='draft'?'Ready to activate your Project?':st==='active'?'Your Project is active':st==='paused'?'Your Project is paused':'Automation is stopped'}</h2><p>Review your approved creative plan and automation settings before enabling scheduled workflows. Activating does not independently authorize external publishing.</p></div><div class="review-activation" style="margin-top:14px"><div class="summarybox"><b>Project configuration</b><p>${S.setupReviewed?'✓ Reviewed':'Not reviewed'} · ${esc(S.project.tone)} · ${esc(S.project.language)}</p><p>Content structure: ${esc(S.project.structure)}</p></div><div class="summarybox"><b>Content plan</b><p>${approved} of ${list.length} launch concepts approved</p><p>${S.concepts.length-list.length} additional ideas kept as drafts</p></div><div class="summarybox"><b>Recurring ideation</b><p>${S.project.ideation?esc(S.project.days)+' · '+esc(S.project.time):'Disabled'}</p></div><div class="summarybox"><b>Publishing</b><p>${S.project.publishing?'Proposed; account + video authorization still required':'Not enabled'}</p></div></div>${!ready?`<div class="review-banner" style="margin-top:14px">To activate, review Project Setup and approve every concept selected for the initial launch. You can keep other ideas as drafts.</div>`:`<div class="review-banner" style="margin-top:14px">✓ Project settings reviewed. ✓ Launch concepts approved. Production cost consent, video approval and publishing authorization remain distinct.</div>`}${st==='draft'?`<div class="review-section"><b>Optional: start initial video production</b><p>Approval makes a concept eligible. Paid generation will only start after separately confirming the selected provider and spending limit.</p><label style="display:flex;align-items:center;gap:8px;font-size:11px;margin-top:11px"><input type="checkbox" data-toggle-initial-render ${S.initialRenderConsent?'checked':''}> Request a separate video production confirmation after activation</label></div>`:''}`;}
function projectReview(){return `<div class="panelhead"><div class="row"><b style="font-size:13px">${S.project.status==='draft'?'Review your new Project':'Project Workspace'}</b>${tag(S.project.status==='draft'?'Draft':S.project.status,S.project.status==='active'?'green':S.project.status==='paused'?'amber':'gray')}</div><span class="tiny">Always editable</span></div><div class="panel-body" style="padding-top:16px">${reviewStepper()}<div style="height:15px"></div>${S.reviewStep==='setup'?reviewProjectSetup():S.reviewStep==='content'?reviewContent():reviewActivation()}</div><div class="panel-footer"><span class="tiny">${S.reviewStep==='setup'?'Review defaults and automation first.':S.reviewStep==='content'?`${initialLaunch().filter(c=>c.approved).length}/${initialLaunch().length} selected concepts approved`:'Activation enables only authorized automation.'}</span><div class="actions">${S.reviewStep==='setup'?btn('Continue to content →','continue-setup','primary'):S.reviewStep==='content'?`${btn('← Project setup','step-setup','sm')}${btn('Continue to activation →','continue-content',reviewReady()?'primary':'')}`:S.project.status==='draft'?`${btn('← Content review','step-content','sm')}${btn('Activate Project','activate',reviewReady()?'primary':'')}`:S.project.status==='active'?btn('Pause Project','pause-project'):btn('Resume Project','resume-project','primary')}</div></div>`;}
function agentSplit(){return `<div class="split-wrap"><div class="split-header"><div class="row" style="min-width:0"><span class="eyebrow" style="margin:0">Creative Workspace</span><span style="color:#c6c0d0">/</span><b style="font-size:12px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden">${esc(S.project.name)}</b></div><div class="actions">${btn(S.agentOpen?'◧ Hide agent':'◨ Show agent','toggle-agent','sm')}${btn('Project details','go-project','sm')}${btn('＋ New chat','new-chat','sm soft')}</div></div><div class="mobile-switch"><button data-action="mobile-chat" class="${S.mobileSide==='chat'?'active':''}">Agent Chat</button><button data-action="mobile-review" class="${S.mobileSide==='review'?'active':''}">Project ${S.agentStage==='planning'?'progress':'review'}</button></div><div class="split ${S.agentOpen?'':'agent-collapsed'}">${chatPanel()}<div class="workpanel ${S.mobileSide==='chat'&&S.agentOpen?'mobile-hidden':''}">${S.agentStage==='planning'?projectProgress():projectReview()}</div></div></div>`;}
function renderAgent(){return shell(S.agentStage==='start'?agentStart():agentSplit(),true);}
function overview(){
const empty=S.overviewMode==='new';
const demoPicker=`<div class="overview-demo"><span>PREVIEW STATE</span><button class="${empty?'selected':''}" data-action="overview-new">New account</button><button class="${!empty?'selected':''}" data-action="overview-returning">With activity</button></div>`;
const hero=`<div class="ov-hero"><div class="ov-hero-copy"><div class="ov-eyebrow"><span class="ov-spark">✦</span> YOUR CREATIVE HOME</div><h1>${empty?'An idea is all<br>you need to <em>begin.</em>':'Good morning,<br><em>creator.</em>'}</h1><p>${empty?'Start with a thought, a product photo, or a content goal. Your agent will prepare the plan for you.':'Your ideas are taking shape. Pick up where you left off, or start something completely new.'}</p><form class="ov-composer" id="overview-form" onsubmit="return false"><label for="overview-idea" class="sr-only">What would you like to create?</label><textarea id="overview-idea" rows="2" placeholder="What would you like to create?" aria-label="Describe your content idea"></textarea><div class="ov-composer-foot"><button type="button" class="ov-attach" data-action="attach" title="Attach reference image">⊕ <span>Add reference</span></button><div class="ov-send-wrap"><span>Send to creative agent</span><button type="button" class="ov-send" data-action="overview-send" aria-label="Send idea to creative agent">↗</button></div></div></form><div class="ov-suggestions"><span>Try an idea</span>${(empty?[starterIdeas[0],starterIdeas[1]]:[starterIdeas[1],starterIdeas[2]]).map(t=>`<button data-prompt="${esc(t)}">${esc(t)}</button>`).join('')}</div></div><div class="ov-hero-art" aria-hidden="true"><div class="ov-art-orbit orbit-a"></div><div class="ov-art-orbit orbit-b"></div><div class="ov-art-stamp stamp-top">✦ &nbsp; IDEA → PROJECT</div><div class="ov-preview-card ov-card-one"><div class="ov-film-art ov-film-orange"><span class="ov-halo"></span><span class="ov-art-emoji">✷</span></div><div class="ov-card-caption">Brand-new ideas, structured.</div></div><div class="ov-preview-card ov-card-two"><div class="ov-film-art ov-film-purple"><span class="ov-art-emoji">🐈</span><span class="ov-star-mini">✧</span></div><div class="ov-card-caption">Made for your style.</div></div><div class="ov-art-stamp stamp-bottom">● &nbsp; AGENT-POWERED CREATION</div></div></div>`;

sational</option></select></div>`:S.editorTab==='pack'?`<div class="field"><label>YouTube title</label><input value="A little product that makes everyday life easier"></div><div class="field" style="margin-top:13px"><label>Caption</label><textarea>Everyday finds worth knowing about ✨ #DailyFinds #ProductReview</textarea></div><div class="notice">Publishing copy is AI-generated and must not contain unsupported product claims.</div>`:`<div class="stack"><div class="run"><b>Current working version</b>${tag('v'+c.version,'gray')}</div><div class="run"><span class="tiny">Approved versions remain immutable and linked to existing videos.</span>${tag('Preserved','green')}</div></div>`}<div class="row" style="margin-top:22px;justify-content:flex-end">${btn('Save changes','save-concept')}${btn('Approve concept','approve-concept','primary')}</div></div><div class="stack"><div class="card pad"><div class="sectionhead"><h2>Creative context</h2>${btn('Edit Kit','kit-from-editor','sm')}</div><div class="row" style="flex-wrap:wrap">${[S.project.tone,S.project.audience,S.project.language].map(x=>tag(x)).join('')}</div><p class="tiny" style="margin-top:14px">This concept inherits your Project's settings but can preserve its own approved snapshot.</p></div><div class="card pad"><div class="sectionhead"><h2>Agent help</h2>${tag('Same Project')}</div><p class="tiny" style="margin-bottom:15px">Ask the agent to refine the hook, propose new shots, or strengthen the storyboard.</p>${btn('Open Agent Workspace','go-agent','soft')}</div><div class="card pad"><h2 style="font-size:15px;margin-bottom:13px">Next step</h2><p class="tiny">Approve this exact version, then choose Remotion, fal.ai or Hybrid. Estimated cost appears before generation.</p></div></div></div>`);}
function productionPage(){const c=getC(S.activeConcept);const opts=[['Remotion','Motion graphics, product imagery, captions','No external video model charge in this mock'],['fal.ai','Generated moving footage, model-dependent','Variable provider cost'],['Hybrid','Generated footage + Remotion composition','Generation + composition cost']];return pageWrap(header('Content / Production','Production Studio',`Choose how “${esc(c.title)}” becomes a video.`,`${tag(c.approved?'Concept approved':'Concept needs approval',c.approved?'green':'amber')} ${btn('Back to editor','go-editor')}`)+`<div class="grid two" style="grid-template-columns:minmax(0,1.1fr) minmax(270px,.9fr)"><div class="stack"><div class="card pad"><div class="sectionhead"><h2>Choose a production method</h2>${tag('Compare outputs')}</div><div class="stack">${opts.map(([k,d,cost])=>`<button class="projecttile" style="flex-direction:row;align-items:center" data-action="mode" data-id="${k}"><span class="num" style="width:40px;height:40px">${k==='Remotion'?'◫':k==='fal.ai'?'✦':'◈'}</span><span style="text-align:left;flex:1"><b>${k}</b><small style="display:block;margin-top:5px">${d}</small><small style="display:block;margin-top:4px">${cost}</small></span><span style="font-size:18px;color:var(--purple)">${S.productionMode===k?'◉':'○'}</span></button>`).join('')}</div>${S.productionMode!=='Remotion'?`<div class="field" style="margin-top:15px"><label>AI video model</label><select data-field="productionModel"><option ${S.productionModel==='Auto'?'selected':''}>Auto</option><option ${S.productionModel==='Kling'?'selected':''}>Kling</option><option ${S.productionModel==='MiniMax'?'selected':''}>MiniMax</option></select></div>`:''}</div><div class="card pad"><div class="row between"><h2 style="font-size:15px">Generation summary</h2>${tag('Illustrative cost','gray')}</div><div class="setting-row"><span class="tiny">Output</span><b style="font-size:12px">9:16 · Short-form MP4</b></div><div class="setting-row"><span class="tiny">Engine</span><b style="font-size:12px">${S.productionMode}</b></div><div class="setting-row"><span class="tiny">Estimated generation cost</span><b style="font-size:12px">${S.productionMode==='Remotion'?'Infrastructure only':'Calculated at runtime'}</b></div><div class="notice amber" style="margin:12px 0">Real pricing and provider capabilities must be checked before authorization. This prototype never starts a paid generation.</div>${btn(S.videoIsRendering?'Mock rendering…':'Generate mock video','generate-video',S.videoIsRendering?'':'primary')}</div></div><div class="card pad"><h2 style="font-size:15px;margin-bottom:14px">Output attempts</h2>${S.videoAttempts.map(v=>`<div class="run" style="margin-top:9px"><div><b style="font-size:12px">Attempt #${v.id} · ${v.engine}</b><p class="tiny">${v.label}</p></div>${tag(v.status,v.status==='ready'?'green':'amber')}<button class="btn sm" data-action="open-video" data-id="${v.id}">Review</button></div>`).join('')}</div></div>`);}

nnection.</p><div style="margin-top:17px">${btn('Create publishing job','go-composer',v.approved?'primary':'soft')}</div></div><div class="notice">If you edit the approved concept, previous video attempts remain linked to the old version. Publication can be held or replaced explicitly.</div></div></div>`);}

function settingsPage(){const st=[['account','Account'],['integrations','Connections'],['telegram','Telegram'],['budget','Budgets'],['notifications','Notifications']];return pageWrap(header('Studio preferences','Settings','Manage account identity, connected channels and agent access.',tag('API-first authentication'))+`<div class="tabs">${st.map(([id,label])=>`<button class="tab ${S.settingsTab===id?'active':''}" data-settings-tab="${id}">${label}</button>`).join('')}</div><div class="card pad" style="max-width:870px">${S.settingsTab==='account'?`<h2 style="font-size:17px;margin-bottom:17px">Your account</h2><div class="formgrid"><div class="field"><label>Display name</label><input value="Studio owner"></div><div class="field"><label>Email</label><input type="email" value="owner@example.com"></div></div><div class="notice" style="margin-top:18px">Login uses Next.js API endpoints backed by Supabase Auth. This sample is not connected to authentication.</div>`:S.settingsTab==='integrations'?`<h2 style="font-size:17px;margin-bottom:15px">Publishing destinations</h2>${[['YouTube','YouTube Shorts publishing'],['Instagram','Reels destination'],['TikTok','Short-form posting']].map(([a,b])=>`<div class="setting-row"><div><b style="font-size:13px">${a}</b><p class="tiny">${b}</p></div>${btn('Connect (demo)','connect-demo','sm')}</div>`).join('')}`:S.settingsTab==='telegram'?`<h2 style="font-size:17px;margin-bottom:15px">Telegram Agent</h2><p class="tiny">Chat with the same n8n agent from Telegram. Link a verified Telegram identity to your Studio account; each conversation has one active Project context.</p><div class="summarybox" style="margin-top:16px"><div class="row between"><b>Telegram connection</b>${tag('Not linked','gray')}</div><p>Identity linking required before the bot can access your Projects or private references.</p></div><div style="margin-top:17px">${btn('Start linking (demo)','telegram-demo','primary')}</div>`:S.settingsTab==='budget'?`<h2 style="font-size:17px;margin-bottom:16px">Generation and Project budgets</h2><div class="formgrid"><div class="field"><label>Monthly budget (USD)</label><input type="number" value="20"></div><div class="field"><label>Per-video maximum (USD)</label><input type="number" value="2"></div></div><div class="notice amber" style="margin-top:19px">Estimated fal.ai cost must be calculated from the live selected model and configuration. Costs here are placeholders.</div>`:`<h2 style="font-size:17px;margin-bottom:16px">Notifications</h2>${[['Concept review required','Notify when agent prepares drafts'],['Video ready for review','Notify when render completes'],['Publishing errors','Notify when a destination fails']].map(([a,b])=>`<div class="setting-row"><div><b style="font-size:12px">${a}</b><p class="tiny">${b}</p></div><input type="checkbox" checked class="toggle"></div>`).join('')}`}</div>`);}
function loginPage(){return `<div class="login-screen"><div class="login-art"><div><div style="font-size:48px;margin-bottom:25px">✦</div><h1>Your ideas deserve a creative studio.</h1><p style="max-width:400px;line-height:1.7;margin-top:18px;opacity:.85">An AI agent for planning, producing and publishing content—without losing creative control.</p></div></div><div class="login-panel"><div class="login-form"><div class="eyebrow">AI Content Studio</div><h2>Welcome back</h2><p>Sign in to continue creating.</p><div class="field"><label>Email</label><input type="email" value="owner@example.com"></div><div class="field" style="margin-top:16px"><label>Password</label><input type="password" value="demo-password"></div><div style="margin-top:24px">${btn('Sign in to demo','login','primary')}</div><div class="notice" style="margin-top:24px">Static sign-in illustration only. Real credentials are handled through Next.js API and Supabase Auth.</div></div></div></div>`;}
function renderFloating(){if(['agent','login','overview'].includes(S.page))return '';return S.float?`<div class="chatfloating"><div class="panelhead"><b style="font-size:13px">✦ Creative Agent</b><button class="iconbtn" data-action="toggle-float">×</button></div><div style="flex:1;padding:18px;overflow:auto"><div class="bubble agent" style="max-width:100%">I'm here while you work. I can help with the current Project, content ideas and automation questions.</div></div><div class="inputdock"><textarea id="float-msg" placeholder="Ask about your Project..."></textarea><button class="btn primary sm" data-action="send-float" style="margin-top:8px">Send ↗</button></div></div>`:`<button class="floatingbtn" data-action="toggle-float">✦ &nbsp; Ask Agent</button>`;}
function renderModal(){if(!S.modal)return '';if(S.modal==='activation'){return `<div class="modal-shade"><div class="modal"><div class="eyebrow">Final confirmation</div><h2>Activate ${esc(S.project.name)}</h2><p>You've reviewed the Creative Kit and approved ${initialLaunch().length} initial concepts. Activation enables only the configured recurring workflows.</p><div class="summarybox" style="margin-top:17px"><div class="setting-row"><b style="font-size:12px">Launch concepts</b>${tag(initialLaunch().length+' approved','green')}</div><div class="setting-row"><b style="font-size:12px">Recurring ideation</b>${tag(S.project.ideation?'Enabled':'Off')}</div><div class="setting-row"><b style="font-size:12px">Publishing</b>${tag('Requires separate authorization','gray')}</div><div class="setting-row"><b style="font-size:12px">Initial video generation</b>${tag('Not automatically started','gray')}</div></div><p class="tiny" style="margin-top:12px">Paid rendering, video approval, and external publication each retain a separate permission boundary.</p><div class="modalactions">${btn('Keep reviewing','close-modal')}${btn('Confirm activation','confirm-activation','primary')}</div></div></div>`;}if(S.modal==='schedule'){return `<div class="modal-shade"><div class="modal"><h2>Edit automation schedule</h2><p>When enabled and active, this rule will propose new concepts on the selected days.</p><div class="field" style="margin-top:17px"><label>Recurrence</label><select id="schedule-days"><option>Monday & Friday</option><option>Every day</option><option>Monday, Wednesday & Friday</option><option>Weekly</option></select></div><div class="field" style="margin-top:13px"><label>Local time</label><input id="schedule-time" type="time" value="09:00"></div><div class="modalactions">${btn('Cancel','close-modal')}${btn('Save schedule','save-schedule','primary')}</div></div></div>`;}if(S.modal==='editproject'){return `<div class="modal-shade"><div class="modal"><h2>Edit Project direction</h2><div class="field" style="margin-top:16px"><label>Project name</label><input id="edit-project-name" value="${esc(S.project.name)}"></div><div class="field" style="margin-top:13px"><label>Goal</label><textarea id="edit-project-goal">${esc(S.project.goal)}</textarea></div><div class="modalactions">${btn('Cancel','close-modal')}${btn('Save Project','save-project','primary')}</div></div></div>`;}return '';}
function render(){if(!S.projectTab)S.projectTab='overview';let content;switch(S.page){case'agent':content=renderAgent();break;case'login':content=loginPage();break;case'overview':content=shell(overview());break;case'projects':content=shell(projectsPage());break;case'project':content=shell(projectPage());break;case'content':content=shell(contentPage());break;case'editor':content=shell(conceptEditor());break;case'production':content=shell(productionPage());break;case'videos':content=shell(videosPage());break;case'video':content=shell(videoPage());break;case'publishing':content=shell(publishingPage());break;case'composer':content=shell(composerPage());break;case'automation':content=shell(automationPage());break;case'runs':content=shell(runsPage());break;case'library':content=shell(libraryPage());break;case'settings':content=shell(settingsPage());break;default:S.page='agent';content=renderAgent()}$('#app').innerHTML=content+(S.drawer?`<aside class="drawer"><div class="drawer-top"><strong>Navigate Studio</strong><button class="iconbtn" data-action="toggle-drawer">×</button></div>${navContent(true)}</aside>`:'')+renderFloating();$('#overlays').innerHTML=renderModal();const th=$('#thread');if(th)th.scrollTop=th.scrollHeight;}
function go(page){if(page==='editor'&&S.projectReady){S.reviewStep='content';S.agentStage='review';S.conceptEditing=false;page='agent';S.mobileSide='review';}S.page=page;S.drawer=false;S.float=false;if(page==='agent'&&S.agentStage==='start'){S.projectReady=false;}render();window.scrollTo(0,0);}
function toast(m){let el=document.createElement('div');el.className='toast';el.textContent=m;$('#toast-area').appendChild(el);setTimeout(()=>el.remove(),3600);}
function begin(prompt){prompt=(prompt||'').trim();if(!prompt){toast('Add an idea to start the conversation.');return;}let isCat=/cat|kitten/i.test(prompt),fan=/fan|product photo|single product/i.test(prompt),dev=/developer|engineering|code/i.test(prompt);S.project={...S.project,id:'p'+Date.now(),name:isCat?'Cat Storytelling':fan?'Mini Fan Promotion':dev?'Developer Shorts':'Affiliate Products',goal:isCat?'Create a warm, entertaining short-form series featuring recurring cat characters.':fan?'Produce one engaging promotional video with trustworthy product references.':dev?'Share concise developer stories and practical engineering insights.':'Create helpful, engaging short-form affiliate content around practical everyday products.',status:'draft',structure:isCat?'Connected series':'Independent',audience:isCat?'Pet owners':dev?'Professionals':'Young adults',objective:isCat?'Entertain':dev?'Educate':'Promote',kitOpen:false};S.concepts=fan?[{id:1,title:'Mini fan · a cool everyday idea',summary:'One short product reveal built from the supplied creative direction.',approved:false,version:1}]:isCat?[{id:1,title:'The Cat Who Applied for a Job',summary:'A curious cat attends a very serious interview.',approved:false,version:1},{id:2,title:'The Midnight Snack Mystery',summary:'A tiny mystery unfolds in the kitchen.',approved:false,version:1},{id:3,title:'A Day as a Software Engineer',summary:'A playful animated slice of life.',approved:false,version:1}]:defaultConcepts();S.activeConcept=S.concepts[0].id;S.concepts.forEach(c=>c.launch=true);S.reviewStep='setup';S.setupReviewed=false;S.conceptEditing=false;S.initialRenderConsent=false;S.agentOpen=true;S.conversation=[{who:'user',text:prompt},{who:'agent',text:'I’m turning your idea into an editable Project plan. I’ll prepare a creative direction, content concepts and automation suggestions on the right.'}];S.agentStage='planning';S.projectReady=false;S.progress=0;S.mobileSide='review';go('agent');const ticket=Date.now();S.planTicket=ticket;[450,1050,1800,2550,3300,3850].forEach((ms,i)=>setTimeout(()=>{if(S.planTicket!==ticket||S.agentStage!=='planning')return;S.progress=Math.min(i,4);if(i===5){S.agentStage='review';S.projectReady=true;S.mobileSide=innerWidth<800?'review':'chat';S.conversation.push({who:'agent',text:`Your ${S.project.name} draft is ready! I’ve prepared ${S.concepts.length} concepts, Creative Kit defaults and a suggested schedule. Review it here or tell me what to change.`});}render();},ms));}
function chatSend(id){const el=$('#'+id);if(!el)return;const text=el.value.trim();if(!text)return;if(S.page!=='agent'){toast('In a real app this is sent through the shared agent. Open the Agent Workspace for the full conversation.');go('agent');return;}S.conversation.push({who:'user',text});const l=text.toLowerCase();let changes=[];if(/add (\d+)|more idea|more content/.test(l)){const n=Math.min(5,Number((l.match(/add (\d+)/)||[])[1]||2));for(let i=0;i<n;i++){let id=Math.max(0,...S.concepts.map(c=>c.id))+1;S.concepts.push({id,title:`New creative concept ${id}`,summary:'A new concept to develop with the agent.',approved:false,version:1});}changes.push(`added ${n} draft concepts`);}for(const v of ['Witty','Playful','Professional','Calm','Energetic'])if(l.includes(v.toLowerCase())){S.project.tone=v;changes.push(`updated tone to ${v}`);break;}if(l.includes('monday and friday')){S.project.days='Monday & Friday';changes.push('changed the ideation schedule');}if(l.includes('remotion')){S.productionMode='Remotion';changes.push('selected Remotion');}if(l.includes('fal.ai')||l.includes('kling')){S.productionMode='fal.ai';changes.push('selected fal.ai for new production');}if(l.includes('audience')&&l.includes('pet')){S.project.audience='Pet owners';changes.push('updated the audience');}S.conversation.push({who:'agent',text:changes.length?`I've ${changes.join(', ')} in your draft Project. You can review the changes on the right.`:'I can help develop that. In this prototype, try asking me to add ideas, change the tone to witty, or switch to fal.ai. The real shared agent will handle open-ended instructions.'});render();}
function handle(action,el){switch(action){
case'toggle-nav': if(S.page==='agent'||window.innerWidth<=800){S.drawer=!S.drawer;}else{S.navCollapsed=!S.navCollapsed;}render();break;
case'toggle-agent':S.agentOpen=!S.agentOpen;S.mobileSide=S.agentOpen?'chat':'review';render();break;
case'review-step':S.reviewStep=el.dataset.step;S.conceptEditing=false;S.mobileSide='review';render();break;
case'continue-setup':S.setupReviewed=true;S.reviewStep='content';S.mobileSide='review';render();break;
case'step-setup':S.reviewStep='setup';render();break;
case'step-content':S.reviewStep='content';render();break;
case'continue-content':if(initialLaunch().length===0){toast('Select at least one launch concept.');break;}if(!reviewReady()){toast('Approve all selected launch concepts first.');break;}S.reviewStep='activate';render();break;
case'select-review-concept':S.activeConcept=Number(el.dataset.id);S.conceptEditing=false;S.editorTab='storyboard';S.mobileSide='review';render();break;
case'edit-review-concept':S.conceptEditing=true;render();break;
case'cancel-review-edit':S.conceptEditing=false;render();break;
case'save-review-edit':{const c=getC(S.activeConcept);const title=$('#review-concept-title')?.value.trim();const summary=$('#review-concept-summary')?.value.trim();if(!title){toast('A concept title is required.');break;}if(title!==c.title||summary!==c.summary){c.title=title;c.summary=summary;c.version++;c.approved=false;}S.conceptEditing=false;render();toast('Draft saved as a new concept version.');break;}
case'approve-review-concept':{const c=getC(S.activeConcept);c.approved=true;render();toast('Concept version approved. No video production started.');break;}
case'add-review-concept':{let id=Math.max(0,...S.concepts.map(c=>c.id))+1;S.concepts.push({id,title:'New content concept',summary:'An editable AI-assisted concept idea.',approved:false,version:1,launch:false});S.activeConcept=id;S.conceptEditing=true;render();toast('Added as a draft, not part of the initial launch.');break;}
case'overview-new':S.overviewMode='new';render();break;case'overview-returning':S.overviewMode='returning';render();break;case'overview-send':begin($('#overview-idea')?.value);break;case'new-chat':S.agentStage='start';S.planTicket=0;S.projectReady=false;S.conversation=[];S.mobileSide='chat';S.reviewStep='setup';S.agentOpen=true;go('agent');break;case'send-start':begin($('#start-msg')?.value);break;case'send-chat':chatSend('chat-msg');break;case'send-float':chatSend('float-msg');break;case'toggle-drawer':S.drawer=!S.drawer;render();break;case'toggle-float':S.float=!S.float;render();break;case'open-agent':go('agent');break;case'go-agent':if(S.projectReady){S.reviewStep='setup';S.agentStage='review';}go('agent');break;case'go-overview':go('overview');break;case'go-projects':go('projects');break;case'go-project':go('project');break;case'go-editor':go('editor');break;case'go-production':go('production');break;case'go-video':go('video');break;case'go-composer':go('composer');break;case'go-publishing':go('publishing');break;case'go-automation':go('automation');break;case'go-runs':go('runs');break;case'go-video':go('video');break;case'open-first-concept':S.activeConcept=1;S.reviewStep='content';S.agentStage='review';S.projectReady=true;S.mobileSide='review';go('agent');break;case'show-all-content':go('content');break;case'open-concept':S.activeConcept=Number(el.dataset.id)||S.activeConcept;S.reviewStep='content';S.agentStage='review';S.projectReady=true;S.mobileSide='review';go('agent');break;case'open-video':S.activeVideo=Number(el.dataset.id)||S.activeVideo;go('video');break;case'open-project':if(el.dataset.id!=='main')toast('Sample Project selected. The full editable workflow is demonstrated with Affiliate Products.');go('project');break;case'toggle-kit':S.project.kitOpen=!S.project.kitOpen;render();break;case'add-concept':S.concepts.push({id:Math.max(0,...S.concepts.map(c=>c.id))+1,title:'Untitled content idea',summary:'New draft concept',approved:false,version:1});render();toast('Draft concept added.');break;case'edit-project':S.modal='editproject';render();break;case'close-modal':S.modal='';render();break;case'save-project':S.project.name=$('#edit-project-name')?.value.trim()||S.project.name;S.project.goal=$('#edit-project-goal')?.value.trim()||S.project.goal;S.modal='';render();toast('Project details updated locally.');break;case'activate':if(!reviewReady()){S.reviewStep=initialLaunch().some(c=>!c.approved)?'content':'setup';render();toast('Complete the review first.');break;}S.modal='activation';render();break;case'confirm-activation':if(!reviewReady()){S.modal='';render();toast('Complete Project and launch-concept review first.');break;}S.project.status='active';S.modal='';S.agentStage='review';S.projectReady=true;render();toast(S.initialRenderConsent?'Project activated. Video production requires separate cost confirmation.':'Project activated. Enabled recurring workflows are simulated.');break;case'pause-project':S.project.status='paused';render();toast('Project automation paused (local simulation).');break;case'resume-project':S.project.status='active';render();toast('Project automation resumed (local simulation).');break;case'stop-project':S.project.status='stopped';render();toast('Project automation stopped locally.');break;case'edit-schedule':S.modal='schedule';render();break;case'save-schedule':S.project.days=$('#schedule-days')?.value||S.project.days;S.project.time=$('#schedule-time')?.value||S.project.time;S.modal='';render();toast('Proposed schedule updated.');break;case'mobile-chat':S.mobileSide='chat';render();break;case'mobile-review':S.mobileSide='review';render();break;case'approve-concept':{const c=getC(S.activeConcept);c.approved=true;render();toast('Concept version approved locally; no paid generation started.');break;}case'save-concept':{const c=getC(S.activeConcept);const ti=$('#concept-title-edit');if(ti?.value.trim())c.title=ti.value.trim();c.version++;c.approved=false;render();toast('New draft version created. Previous approved history is preserved.');break;}case'kit-from-editor':S.projectTab='kit';go('project');break;case'mode':S.productionMode=el.dataset.id;render();break;case'generate-video':{const c=getC(S.activeConcept);if(!c.approved){toast('Approve the current concept version first.');return;}if(S.videoIsRendering)return;S.videoIsRendering=true;let v={id:S.videoAttempts.length+1,engine:S.productionMode,status:'generating',approved:false,cost:'Demo',label:'New simulated output'};S.videoAttempts.unshift(v);render();toast('Simulating rendering; no provider request or charge.');setTimeout(()=>{v.status='ready';S.videoIsRendering=false;S.activeVideo=v.id;render();toast('Mock render ready for review.');},1800);break;}case'approve-video':getV(S.activeVideo).approved=true;render();toast('Video approved locally; no publication authorized.');break;case'revoke-video':getV(S.activeVideo).approved=false;render();toast('Future publication authorization revoked in prototype.');break;case'regenerate-video':go('production');toast('Choose a mode for another independent output attempt.');break;case'download-demo':toast('No downloadable MP4 exists: this is a screen prototype.');break;case'create-schedule':{let vid=Number($('#post-video')?.value);let v=getV(vid);if(!v.approved){toast('Select an approved video first.');return;}let date=$('#post-date')?.value||'2026-12-02',time=$('#post-time')?.value||'09:00',title=$('#post-title')?.value||'New post',channel=$('#post-channel')?.value||'YouTube Shorts';const wd=new Date(date+'T12:00:00').getDay();S.schedule.push({title,date,time,channel,weekDay:(wd+6)%7});go('publishing');toast('Mock publishing job added locally. No platform upload authorized.');break;}case'attach':toast('File upload is not connected in this standalone prototype.');break;case'connect-demo':toast('OAuth connection is not connected in this standalone prototype.');break;case'telegram-demo':toast('Telegram linking uses an authenticated challenge in the real application.');break;case'settings-integrations':S.settingsTab='integrations';go('settings');break;case'login':S.auth=true;go('overview');toast('Demo sign-in only. Welcome to Overview.');break;}}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.go){go(t.dataset.go);return;}if(t.dataset.prompt){begin(t.dataset.prompt);return;}if(t.dataset.action){handle(t.dataset.action,t);return;}if(t.dataset.projectTab){S.projectTab=t.dataset.projectTab;render();return;}if(t.dataset.editorTab){S.editorTab=t.dataset.editorTab;render();return;}if(t.dataset.settingsTab){S.settingsTab=t.dataset.settingsTab;render();return;}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='launch-toggle'){const c=getC(S.activeConcept);c.launch=t.checked;render();toast(t.checked?'Added to initial launch.':'Kept as draft outside initial launch.');return;}if(t.dataset.toggleInitialRender!==undefined){S.initialRenderConsent=t.checked;return;} if(t.dataset.setting){S.project[t.dataset.setting]=t.value;render();toast('Creative Kit updated.');}if(t.dataset.toggle){S.project[t.dataset.toggle]=t.checked;render();toast('Automation preference updated locally.');}if(t.dataset.field){if(t.dataset.field==='productionModel')S.productionModel=t.value;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal='';render();}if(e.key==='Enter'&&!e.shiftKey&&(e.target.id==='start-msg'||e.target.id==='chat-msg'||e.target.id==='overview-idea')){e.preventDefault();if(e.target.id==='start-msg'||e.target.id==='overview-idea')begin(e.target.value);else chatSend('chat-msg');}});
// Deliberately no URL/API requests: all interactions stay inside the standalone design prototype.
render();

function pill(status,label){const cls=status==='approved'?'approved':status==='active'?'active':status==='draft'?'draft':status==='paused'?'paused':status==='stopped'?'stopped':status==='pending'?'pending':status==='scheduled'?'blue':'off';return `<span class="pill ${cls}">${esc(label||status[0].toUpperCase()+status.slice(1))}</span>`}

function overview(){const pending=C.filter(c=>c.status!=='approved').length,active=P.filter(p=>p.status==='active').length;return `<div class="page"><div class="row between" style="margin-bottom:18px"><div class="eyebrow" style="margin:0">STUDIO / OVERVIEW</div><div class="actions">${btn('New account','overview-new','btn small '+(S.overviewNew?'soft':''))}${btn('With activity','overview-active','btn small '+(!S.overviewNew?'soft':''))}</div></div><div class="hero"><div><div class="eyebrow">✦ YOUR CREATIVE HOME</div><h1>Good morning,<br><em>creator.</em></h1><p>Start from a thought, a product or a story. Your creative agent helps turn it into a Project with content and automation.</p>${ideaForm('overview-message','I want to create content about...')}<div class="quickprompts"><button class="prompt" data-prompt="I want to create affiliate content for home products">Affiliate products</button><button class="prompt" data-prompt="I want to create a funny cat storytelling series">Cat storytelling series</button><button class="prompt" data-prompt="Create a short product video from my reference">One product video</button></div></div><div class="heroart"><div class="art-card one"><div class="art-circle"></div><span>✳</span></div><div class="art-card two"><div class="art-circle"></div><span>🐈</span></div><div class="art-caption">✦ IDEA → PROJECT</div></div></div>${S.overviewNew?`<div class="card pad" style="margin-top:22px"><div class="empty-state"><div style="font-size:34px">✦</div><h3>Your studio starts with one idea</h3><p>Tell the agent what you want to create. You can review the Project, its content and settings before activating automation.</p>${btn(`${ic('sparkles')} Start creating`,'new-chat','btn primary')}</div></div>`:`<div class="grid g4" style="margin-top:20px">${[['Projects',P.length,'folder'],['Concepts to review',pending,'file'],['Videos ready',V.filter(v=>!v.approved).length,'film'],['Active projects',active,'bolt']].map(([t,n,i])=>`<div class="card metric"><div class="row between"><span>${t}</span><div class="iconTile">${ic(i)}</div></div><strong>${n}</strong><small>Across your Studio</small></div>`).join('')}</div><div class="grid g2 dashboard-bottom"><div class="card pad"><div class="section"><div><div class="eyebrow">PICK UP WHERE YOU LEFT OFF</div><h2>Needs your attention</h2></div>${btn('See content →','go-content','btn ghost small')}</div><div class="listrow"><div class="row"><div class="iconTile">${ic('folder')}</div><div><b class="small">Finish your draft Project</b><p class="tiny muted">Affiliate Products · 1 concept needs approval</p></div></div>${btn(ic('arrow'),'open-p1','btn icononly small')}</div><div class="listrow"><div class="row"><div class="iconTile peach">${ic('file')}</div><div><b class="small">Review kitchen organizer scenes</b><p class="tiny muted">Script and storyboard · Pending</p></div></div>${btn(ic('arrow'),'open-c2','btn icononly small')}</div><div class="listrow"><div class="row"><div class="iconTile green">${ic('film')}</div><div><b class="small">Review your generated video</b><p class="tiny muted">Cat Storytelling · Ready</p></div></div>${btn(ic('arrow'),'open-v1','btn icononly small')}</div></div><div class="card pad"><div class="section"><div><div class="eyebrow">YOUR AUTOMATION</div><h2>Automation at a glance</h2></div>${btn('Manage →','go-automation','btn ghost small')}</div><div class="note green"><b>${ic('bolt')} Cat Storytelling</b><div style="margin-top:7px">Recurring ideation is enabled · Next Monday at 10:00</div></div><div class="kv"><label>Active recurring Projects</label><b>1</b></div><div class="kv"><label>Scheduled publishing</label><b>${S.publishing.length} job</b></div><div class="kv"><label>Publishing permission</label><span class="pill pending">Manual review</span></div><div class="note" style="margin-top:14px">Project activation and concept/video approval are independent. No automatic publication without authorization.</div></div></div><div class="section" style="margin:25px 0 14px"><div><div class="eyebrow">YOUR CREATIVE WORK</div><h2>Recent Projects</h2></div>${btn('All Projects →','go-projects','btn ghost small')}</div><div class="grid g3">${P.slice(0,3).map(projectTile).join('')}</div>`}${footnote()}</div>`}

function projectTabs(){return `<div class="tabs">${[['overview','Overview'],['content','Content'],['kit','Creative Kit'],['automation','Automation'],['publishing','Publishing'],['assets','Assets'],['activity','Activity']].map(([id,label])=>`<button class="tab ${S.projectTab===id?'active':''}" data-project-tab="${id}">${label}</button>`).join('')}</div>`}
function project(){let p=proj(),cc=cs(p.id),lc=launch(p.id),reviewCount=lc.filter(c=>c.status!=='approved').length;let action=p.status==='draft'?btn(`${ic('play')} Activate Project`,'activate-project','btn primary'):p.status==='active'?btn(`${ic('pause')} Pause`,'pause-project','btn soft'):btn(`${ic('play')} ${p.status==='paused'?'Resume':'Reactivate'}`,'resume-project','btn primary');return `<div class="page"><div class="eyebrow">PROJECT WORKSPACE</div><div class="project-hero" style="margin-bottom:19px"><div><div class="row" style="margin-bottom:6px"><h1>${esc(p.name)}</h1>${pill(p.status)}</div><p>${esc(p.goal)}</p><div class="row" style="margin-top:14px;flex-wrap:wrap"><span class="badge-outline">${esc(p.kind)}</span><span class="badge-outline">${cc.length} concepts</span><span class="badge-outline">${esc(p.kit.language)}</span></div></div><div class="actions">${btn(`${ic('edit')} Edit details`,'edit-project','btn')}${action}${p.status==='active'?btn(`${ic('ellipsis')} Stop`,'stop-project','btn'):''}</div></div>${projectTabs()}<div id="project-tab-content">${projectTabContent(p)}</div>${footnote()}</div>`}
function projectTabContent(p){const cc=cs(p.id),lc=launch(p.id),pending=lc.filter(c=>c.status!=='approved');if(S.projectTab==='overview'){return `<div class="grid g2" style="align-items:start"><div class="stack"><div class="card pad"><div class="section"><div><h2>Project readiness</h2><p>Review initial content and turn on automations when you’re ready.</p></div>${p.status==='draft'?pill('draft','Preparing'):pill(p.status)}</div><div class="checks"><div class="checkrow"><span class="checkdot done">${ic('check',13)}</span><div><b>Creative Kit is prepared</b><div class="tiny muted">You can adjust tone, audience and visual direction in the Creative Kit tab.</div></div></div><div class="checkrow"><span class="checkdot ${pending.length?'':'done'}">${ic(pending.length?'clock':'check',13)}</span><div><b>${lc.length-pending.length} of ${lc.length} launch concepts approved</b><div class="tiny muted">${pending.length?`${pending.length} concept${pending.length>1?'s':''} need detailed script and scene review.`:'All selected launch concepts are ready.'}</div></div></div><div class="checkrow"><span class="checkdot done">${ic('check',13)}</span><div><b>Automation settings are configured</b><div class="tiny muted">Configured rules only run when the Project is active.</div></div></div></div>${p.status==='draft'?`<div class="divider"></div><div class="row between" style="gap:8px"><div class="tiny muted">${eligible(p.id)?'Ready for activation.':'Finish the selected launch content, then activate.'}</div>${btn(`${ic(eligible(p.id)?'play':'file')} ${eligible(p.id)?'Activate':'Review content'}`,eligible(p.id)?'activate-project':'project-content','btn '+(eligible(p.id)?'primary':'soft'))}</div>`:''}</div><div class="card pad"><div class="section"><div><h2>Content plan</h2><p>Click a concept to review its full details.</p></div>${btn('All content →','project-content','btn ghost small')}</div>${cc.slice(0,4).map(c=>`<div class="listrow"><div class="row"><div class="iconTile ${c.status==='approved'?'green':'peach'}">${ic(c.status==='approved'?'check':'file')}</div><div><b class="small">${esc(c.title)}</b><p class="tiny muted">${c.scenes.length||3} scenes · Version ${c.version}</p></div></div><div class="actions">${pill(c.status)}${btn(ic('arrow'),'open-concept','btn icononly small',`data-id="${c.id}"`)}</div></div>`).join('')}</div></div><div class="stack"><div class="card pad"><div class="section"><h2>Creative Kit</h2>${btn('Edit →','project-kit','btn ghost small')}</div><div class="row" style="flex-wrap:wrap">${[p.kit.tone,p.kit.audience,p.kit.language,p.kit.structure].map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><div class="note" style="margin-top:15px">${esc(p.kit.details)}</div></div><div class="card pad"><div class="section"><h2>Automation</h2>${btn('Manage →','project-automation','btn ghost small')}</div><div class="kv"><label>Recurring ideation</label>${pill(p.automation.ideation&&p.status==='active'?'active':'stopped',p.automation.ideation?'Configured':'Off')}</div><div class="kv"><label>Suggested frequency</label><b>${esc(p.automation.days)} · ${esc(p.automation.time)}</b></div><div class="kv"><label>Publishing automation</label><b>${p.automation.publishing?'Enabled':'Off'}</b></div><div class="kv"><label>Generation budget</label><b>$${p.automation.budget} per month</b></div></div></div></div>`}
if(S.projectTab==='content'){return `<div class="card pad"><div class="section"><div><h2>Content plan</h2><p>Select a concept to open its dedicated detailed review page.</p></div>${btn(`${ic('plus')} Add concept`,'add-concept','btn soft')}</div><div class="note" style="margin-bottom:16px">Only concepts selected for initial launch need approval before activation. Others may stay as drafts; this is not a rejection action.</div><div class="stack">${cc.map(c=>`<div class="concept-card"><div class="row" style="align-items:flex-start;min-width:0"><div class="mini-illustration">${c.emoji}</div><div><div class="row" style="flex-wrap:wrap"><b class="concept-title">${esc(c.title)}</b>${pill(c.status)}</div><p>${esc(c.summary)}</p><div class="row" style="margin-top:10px"><label class="tiny muted"><input type="checkbox" data-launch="${c.id}" ${c.launch?'checked':''}> Include in initial launch</label><span class="tiny muted">v${c.version} · ${c.scenes.length||3} scenes</span></div></div></div><button class="btn small" data-action="open-concept" data-id="${c.id}">Open details ${ic('arrow')}</button></div>`).join('')}</div></div>`}
if(S.projectTab==='kit'){const k=p.kit;return `<div class="grid g2" style="align-items:start"><div class="card pad"><div class="section"><div><h2>Creative Kit</h2><p>AI-prepared defaults you can adjust using structured options.</p></div><span class="pill">Editable</span></div><div class="formgrid">${fieldSelect('Language','language',['Indonesian','English'],k.language)}${fieldSelect('Tone','tone',['Playful','Witty','Professional','Calm','Educational','Energetic'],k.tone)}${fieldSelect('Audience','audience',['Everyday shoppers','Pet owners','Developers','Parents','Small businesses','General audience'],k.audience)}${fieldSelect('Objective','objective',['Promote','Educate','Entertain','Inspire','Build awareness'],k.objective)}${fieldSelect('Content structure','structure',['Independent content','Connected series','One-off promotion','Tutorial series'],k.structure)}${fieldSelect('Visual direction','visual',['Modern product design','Illustrated / animated','Motion graphics','Cinematic','Minimal and clean'],k.visual)}</div><div class="field" style="margin-top:16px"><label>Additional creative direction · optional</label><textarea id="kit-details">${esc(k.details)}</textarea></div><div class="row" style="justify-content:flex-end;margin-top:18px">${btn(`${ic('check')} Save Creative Kit`,'save-kit','btn primary')}</div></div><div class="card pad"><div class="section"><h2>How AI uses the Kit</h2></div><div class="stack"><div class="note">The Agent suggests structured defaults from the user's idea, but explicit edits always win.</div><div class="kv"><label>New concepts</label><b>Use latest settings</b></div><div class="kv"><label>Previously approved concepts</label><b>Keep old snapshot</b></div><div class="kv"><label>Existing published videos</label><b>Never rewritten</b></div><p class="small muted line">You can also ask the Agent to change these settings. Editing the Kit never quietly overwrites an approved concept version.</p></div></div></div>`}
if(S.projectTab==='automation'){const a=p.automation;return `<div class="grid g2" style="align-items:start"><div class="card pad"><div class="section"><div><h2>Project automation</h2><p>Rules are editable in every Project status.</p></div>${pill(p.status)}</div><div class="listrow"><div><b class="small">Recurring ideation</b><p class="tiny muted">Prepare new concepts on your chosen schedule.</p></div><input class="toggle" type="checkbox" data-automation="ideation" ${a.ideation?'checked':''}></div><div class="listrow"><div><b class="small">Automatic scheduled publishing</b><p class="tiny muted">Requires approved videos and destination authorization.</p></div><input class="toggle" type="checkbox" data-automation="publishing" ${a.publishing?'checked':''}></div><div class="formgrid" style="margin-top:18px">${fieldSelect('Ideation days','autodays',['Monday & Friday','Every day','Monday','Wednesday','Every week'],a.days)}<div class="field"><label>Local schedule time</label><input id="autotime" type="time" value="${a.time}"></div></div><div class="field" style="margin-top:14px"><label>Monthly generation budget (USD)</label><input id="autobudget" type="number" min="0" value="${a.budget}"></div><div class="row" style="justify-content:flex-end;margin-top:17px">${btn('Save automation preferences','save-automation','btn primary')}</div></div><div class="card pad"><div class="section"><h2>Execution permissions</h2></div><div class="kv"><label>Project state</label>${pill(p.status)}</div><div class="kv"><label>Content approval</label><b>Manual by default</b></div><div class="kv"><label>Paid video generation</label><b>Separate authorization</b></div><div class="kv"><label>Public publishing</label><b>Explicit account + schedule</b></div><div class="note amber" style="margin-top:18px">${p.status==='draft'?'These settings are proposals. Recurring automation is not running while the Project is Draft.':p.status==='active'?'Enabled rules may run when due. Individual content and publishing gates still apply.':'No new automatic jobs are claimed while this Project is '+p.status+'.'}</div></div></div>`}
if(S.projectTab==='publishing'){return `<div class="grid g2"><div class="card pad"><div class="section"><h2>Publishing preferences</h2></div><div class="kv"><label>Default destination</label><b>YouTube Shorts</b></div><div class="kv"><label>Publication language</label><b>${esc(p.kit.language)}</b></div><div class="kv"><label>Scheduling</label><b>${p.automation.publishing?'Configured':'Manual'}</b></div>${btn(`${ic('calendar')} Open publish composer`,'go-composer','btn primary', 'style="margin-top:17px"')}</div><div class="card pad"><div class="section"><h2>Publishing jobs</h2></div>${S.publishing.filter(e=>e.projectId===p.id).length?S.publishing.filter(e=>e.projectId===p.id).map(e=>`<div class="listrow"><b>${esc(e.title)}</b>${pill(e.status)}</div>`).join(''):`<div class="empty-state"><div style="font-size:29px">${ic('calendar',31)}</div><h3>Nothing scheduled yet</h3><p>Creation works without connecting a social account. Schedule when an approved video is ready.</p></div>`}</div></div>`}
if(S.projectTab==='assets'){return `<div class="grid g3">${[['🌀','Product reference','Uploaded image'],['🎨','Brand palette','Creative Kit'],['🎙️','Narration voice','ElevenLabs preset']].map(([e,t,s])=>`<div class="card pad"><div class="summary-illustration" style="min-height:145px;font-size:45px">${e}</div><h3 style="font-size:14px;margin-top:13px">${t}</h3><p class="tiny muted" style="margin-top:7px">${s}</p></div>`).join('')}</div>`}
return `<div class="card pad"><div class="section"><h2>Project activity</h2></div><div class="timeline-track">${[['Project created','Agent prepared an editable Project proposal.'],['Creative Kit prepared','Suggested tone, objective and content structure.'],['Latest content update','Concepts can be edited independently.']].map(([t,s])=>`<div class="timeline-row"><b class="small">${t}</b><p class="xs muted" style="margin-top:5px">${s}</p></div>`).join('')}</div><div class="divider"></div><h3 style="font-size:14px;margin-bottom:10px">Agent conversations</h3><div class="row between"><span class="small muted">Project-linked conversation context</span>${btn(`${ic('chat')} Open Agent`,'toggle-agent','btn soft small')}</div></div>`}
function fieldSelect(label,field,options,v){return `<div class="field"><label>${label}</label><select data-kit="${field}">${options.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
function content(){const matches=C.filter(c=>!S.search||(`${c.title} ${P.find(p=>p.id===c.projectId)?.name}`).toLowerCase().includes(S.search.toLowerCase()));return `<div class="page"><div class="pagehead"><div><div class="eyebrow">CONTENT LIBRARY</div><h1>Content</h1><p>Browse concepts across Projects. Open one for its complete creative brief, script, storyboard, assets and Publishing Pack.</p></div>${btn(`${ic('sparkles')} Create with AI`,'new-chat','btn primary')}</div><div class="card pad"><div class="row between" style="margin-bottom:15px"><div class="row">${ic('search')} <span class="small muted">${matches.length} concepts across ${P.length} Projects</span></div><div class="actions">${btn('All','filter-all','btn small soft')}${btn('Needs approval','filter-pending','btn small')}${btn('Approved','filter-approved','btn small')}</div></div><div class="grid g2">${matches.map(c=>`<div class="concept-card"><div class="row" style="align-items:flex-start"><div class="mini-illustration">${c.emoji}</div><div><span class="tiny muted">${esc(P.find(p=>p.id===c.projectId)?.name)}</span><div class="concept-title" style="margin:5px 0">${esc(c.title)}</div><p>${esc(c.summary)}</p><div class="row" style="margin-top:10px">${pill(c.status)}<span class="tiny muted">Version ${c.version}</span></div></div></div>${btn(ic('arrow'),'open-concept','btn small icononly',`data-id="${c.id}"`)}</div>`).join('')}</div></div>${footnote()}</div>`}
function contentDetail(){const c=concept(),p=proj();const tabs=[['overview','Overview'],['script','Script & Narration'],['storyboard','Storyboard & Scenes'],['assets','Assets'],['publishing','Publishing Pack'],['history','Versions']];return `<div class="page"><div class="row" style="margin-bottom:18px">${btn(`${ic('arrowleft')} ${esc(p.name)}`,'back-project-content','btn small ghost')}<span class="tiny muted">/ Content / ${esc(c.title)}</span></div><div class="detailhead"><div><div class="eyebrow">CONTENT DETAIL · VERSION ${c.version}</div><div class="row" style="flex-wrap:wrap;gap:9px"><h1>${esc(c.title)}</h1>${pill(c.status)}</div><p>${esc(c.summary)}</p><div class="row" style="margin-top:12px;flex-wrap:wrap"><span class="badge-outline">${esc(p.name)}</span><span class="badge-outline">${c.scenes.length||3} scenes</span><span class="badge-outline">${esc(p.kit.language)}</span><span class="badge-outline">${c.launch?'Initial launch':'Future draft'}</span></div></div><div class="actions">${btn(`${ic('edit')} Edit`,'edit-concept','btn')}${c.status!=='approved'?btn(`${ic('check')} Approve concept`,'approve-concept','btn primary'):btn(`${ic('check')} Approved`,'noop','btn soft','disabled')}</div></div><div class="note" style="margin:18px 0">Review the script, storyboard, visual references and publishing details for this content. Approval saves this version for production eligibility; it does not automatically spend credits or publish.</div><div class="tabs">${tabs.map(([id,label])=>`<button class="tab ${S.contentTab===id?'active':''}" data-content-tab="${id}">${label}</button>`).join('')}</div>${contentTabContent(c,p)}${footnote()}</div>`}
function getScenes(c){if(c.scenes&&c.scenes.length)return c.scenes;return [{name:'Opening hook',time:'0–4s',caption:c.hook,visual:c.emoji,look:'peach',motion:'Kinetic type reveal',assets:'Designed background and text',narration:c.script[0]},{name:'The main story',time:'4–11s',caption:'The story unfolds',visual:'✦',look:'blue',motion:'Layered movement · parallax',assets:'Character/reference visuals',narration:c.script[1]},{name:'Closing beat',time:'11–15s',caption:'Come back for more',visual:'✨',look:'dark',motion:'Soft scene transition',assets:'Brand visual outro',narration:c.script[2]}]}
function contentTabContent(c,p){const scenes=getScenes(c);if(S.contentTab==='overview')return `<div class="grid g2" style="align-items:start"><div class="stack"><div class="card pad"><div class="section"><h2>Creative brief</h2><span class="pill">AI prepared</span></div><div class="kv"><label>Opening hook</label><b>${esc(c.hook)}</b></div><div class="kv"><label>Objective</label><b>${esc(p.kit.objective)}</b></div><div class="kv"><label>Target audience</label><b>${esc(p.kit.audience)}</b></div><div class="kv"><label>Tone</label><b>${esc(p.kit.tone)}</b></div><div class="kv"><label>Estimated duration</label><b>15 seconds · Vertical 9:16</b></div></div><div class="card pad"><div class="section"><h2>Story summary</h2>${btn('Read script →','tab-script','btn ghost small')}</div><p class="small muted line">${esc(c.summary)}</p><div class="note" style="margin-top:16px">The Agent can suggest changes, but an edited approved concept becomes a new draft version before new production.</div></div></div><div class="stack"><div class="card pad"><div class="section"><h2>Scene storyboard</h2>${btn('Full storyboard →','tab-storyboard','btn ghost small')}</div><div class="grid g3" style="gap:9px">${scenes.map((s,i)=>`<div><div class="scene-visual ${s.look}" style="min-height:130px;border-radius:10px"><div class="ring" style="width:100px;height:100px"></div><span class="bigemoji" style="font-size:40px">${s.visual}</span></div><div class="tiny muted" style="margin-top:8px">${s.time}</div><b class="xs">${esc(s.name)}</b></div>`).join('')}</div></div><div class="card pad"><div class="section"><h2>Next action</h2></div><p class="small muted line">${c.status==='approved'?'Your current version is approved for eligible production. Choose how you want to render it.':'Review the script and scenes, make changes if needed, then approve this exact version.'}</p><div class="actions" style="margin-top:18px">${c.status==='approved'?btn(`${ic('film')} Open Production Studio`,'go-production','btn primary'):btn(`${ic('eye')} Review storyboard`,'tab-storyboard','btn primary')}</div></div></div></div>`;
if(S.contentTab==='script')return `<div class="grid g2" style="align-items:start"><div class="card pad"><div class="section"><h2>Script & spoken narration</h2><span class="pill">${esc(p.kit.language)}</span></div><div class="note">The script is separate from Project automation and preserves the exact content version approved for rendering.</div>${c.script.map((l,i)=>`<div class="script-row"><div class="script-time">${['0–4s','4–11s','11–15s'][i]||'15s+'}</div><div><b class="small">Scene ${i+1}</b><div class="script-line" style="margin-top:5px">“${esc(l)}”</div></div></div>`).join('')}<div style="margin-top:18px">${btn(`${ic('edit')} Edit script`,'edit-concept','btn soft')}</div></div><div class="card pad"><div class="section"><h2>Narration direction</h2></div><div class="kv"><label>Provider</label><b>ElevenLabs</b></div><div class="kv"><label>Language</label><b>${esc(p.kit.language)}</b></div><div class="kv"><label>Delivery</label><b>${esc(p.kit.tone)}</b></div><div class="kv"><label>Subtitles</label><b>On by default</b></div><div class="divider"></div><h3 class="font15">Timing preview</h3><div class="timeline" style="margin:14px 0 6px"><span style="flex:4"></span><span style="flex:7"></span><span style="flex:4"></span></div><div class="row between tiny muted"><span>0s</span><span>4s</span><span>11s</span><span>15s</span></div></div></div>`;
if(S.contentTab==='storyboard')return `<div class="grid" style="grid-template-columns:minmax(0,1fr)"><div class="section"><div><h2>Storyboard & scene direction</h2><p>Every scene has its own visual composition, media plan, motion and narration.</p></div><span class="badge-outline">9:16 · 15 seconds</span></div>${scenes.map((s,i)=>`<div class="scene-card"><div class="scene-visual ${s.look}"><div class="ring"></div><div class="bigemoji">${s.visual}</div><div class="labelstrip">${esc(s.caption)}</div></div><div class="scene-body"><div class="row between"><span class="eyebrow" style="margin:0">SCENE ${String(i+1).padStart(2,'0')}</span><span class="pill">${s.time}</span></div><h3>${esc(s.name)}</h3><p class="scene-text">${esc(s.narration)}</p><div class="divider" style="margin:13px 0"></div><div class="grid g2" style="gap:11px"><div><div class="tiny muted">Visuals & assets</div><div class="xs semibold" style="margin-top:6px">${esc(s.assets)}</div></div><div><div class="tiny muted">Motion & transitions</div><div class="xs semibold" style="margin-top:6px">${esc(s.motion)}</div></div></div><div class="tagrow"><span class="tag">On-screen text: ${esc(s.caption)}</span><span class="tag">Narration aligned</span></div></div></div>`).join('')}<div class="note">This is a storyboard preview. Remotion implements predefined motion/layout components; fal.ai generates footage from supported prompts and reference assets. Available animations and video effects depend on the selected production method.</div></div>`;
if(S.contentTab==='assets')return `<div class="grid g3">${[['🌀','Product photo','Supplied reference · Source'],['🎨','Background / keyframe','Generated or designed asset'],['🔊','Narration audio','Generated after approval']].map(([e,t,desc])=>`<div class="card pad"><div class="summary-illustration" style="font-size:47px">${e}</div><h3 style="font-size:14px;margin-top:13px">${t}</h3><div class="tiny muted" style="margin-top:7px">${desc}</div></div>`).join('')}<div class="note" style="grid-column:1/-1">All reference images, factual product claims and generated media must be traceable to source assets. The production plan uses approved asset IDs, not untrusted arbitrary URLs.</div></div>`;
if(S.contentTab==='publishing')return `<div class="grid g2" style="align-items:start"><div class="card pad"><div class="section"><h2>Publishing Pack</h2></div><div class="field"><label>Suggested title</label><div class="code-like">${esc(c.publish.title)}</div></div><div class="field" style="margin-top:15px"><label>Description</label><div class="code-like">${esc(c.publish.description)}</div></div><div class="field" style="margin-top:15px"><label>Hashtags</label><div class="code-like">${esc(c.publish.hashtags)}</div></div><div class="row" style="margin-top:18px">${btn(`${ic('edit')} Edit content version`,'edit-concept','btn soft')}</div></div><div class="card pad"><h2 class="font15">Separate publishing authorization</h2><p class="small muted line" style="margin:12px 0 15px">The Publishing Pack is creative metadata. A real publishing job must still choose an approved video output, a connected account and an authorized schedule.</p>${btn(`${ic('calendar')} Open Publishing`,'go-publishing','btn soft')}</div></div>`;
return `<div class="card pad"><div class="section"><h2>Version history</h2></div><div class="timeline-track"><div class="timeline-row"><b class="small">Version ${c.version} · ${c.status==='approved'?'Approved':'Working draft'}</b><p class="xs muted" style="margin-top:5px">Current concept content and scene plan</p></div>${c.version>1?`<div class="timeline-row"><b class="small">Version ${c.version-1} · Previous approved snapshot</b><p class="xs muted" style="margin-top:5px">Older production and publishing jobs keep their original references.</p></div>`:''}<div class="timeline-row"><b class="small">Original idea</b><p class="xs muted" style="margin-top:5px">Preserved even after edits and regeneration.</p></div></div></div>`}
function production(){let c=concept(),p=proj();return `<div class="page"><div class="row" style="margin-bottom:17px">${btn(`${ic('arrowleft')} Back to concept`,'go-detail','btn small ghost')}<span class="tiny muted">${esc(c.title)}</span></div><div class="pagehead"><div><div class="eyebrow">PRODUCTION STUDIO</div><h1>Create your video</h1><p>Choose how this approved concept becomes moving footage. Each attempt stays separate so you can compare the results.</p></div>${pill(c.status)}</div><div class="grid g2" style="align-items:start"><div class="card pad"><div class="section"><div><h2>Video generation method</h2><p>Pick the best fit for the look you want.</p></div></div>${[['remotion','layers','Remotion','Code-driven motion graphics and compositing.'],['fal','sparkles','fal.ai','AI-generated footage from text or reference images.'],['hybrid','film','Hybrid','fal.ai footage composed with Remotion graphics.']].map(([id,i,t,d])=>`<button class="choice ${S.productionMode===id?'active':''}" data-mode="${id}"><div class="iconTile">${ic(i)}</div><div style="flex:1"><b class="small">${t}</b><p class="tiny muted" style="margin-top:4px">${d}</p></div><span class="choice-circle"></span></button>`).join('')}<div class="divider"></div>${S.productionMode!=='remotion'?`<div class="field" style="margin-bottom:15px"><label>AI video model</label><select id="video-model"><option value="minimax" ${S.model==='minimax'?'selected':''}>MiniMax · Budget-focused</option><option value="kling" ${S.model==='kling'?'selected':''}>Kling · Higher-quality option</option><option value="auto" ${S.model==='auto'?'selected':''}>Auto · Choose compatible model</option></select></div>`:''}<div class="kv"><label>Output format</label><b>9:16 · MP4</b></div><div class="kv"><label>Narration</label><b>ElevenLabs</b></div><div class="kv"><label>Estimated cost</label><b>${S.productionMode==='remotion'?'Rendering infrastructure cost':S.productionMode==='fal'?'Illustrative · from $0.20':'Illustrative · from $0.20 + composition'}</b></div><div class="note amber" style="margin:15px 0">Actual provider price, compatibility and budget are checked when generating. This preview makes no paid calls.</div>${btn(`${ic('play')} Generate preview attempt`,'generate-video','btn primary','style="width:100%"')}</div><div class="stack"><div class="card pad"><div class="section"><h2>Approved content</h2>${btn('View details →','go-detail','btn ghost small')}</div><div class="prodbox"><div class="image">${c.emoji}</div><div><b class="small">${esc(c.title)}</b><p class="tiny muted" style="margin-top:5px">Version ${c.version} · ${getScenes(c).length} scenes</p></div></div><div class="note" style="margin-top:15px">The production plan includes visual assets, scene layouts, motion and narration timing. Avoid script-to-static-text-only video composition.</div></div><div class="card pad"><div class="section"><h2>Recent attempts</h2></div>${V.filter(v=>v.conceptId===c.id).length?V.filter(v=>v.conceptId===c.id).map(v=>`<div class="listrow"><div class="row"><div class="iconTile">${ic('film')}</div><div><b class="xs">${esc(v.engine)}</b><div class="tiny muted">${v.status} · ${esc(v.cost)}</div></div></div><button class="btn small" data-action="open-video" data-id="${v.id}">Open →</button></div>`).join(''):`<div class="empty-state"><h3>No video attempts yet</h3><p>Generate one using a chosen production method.</p></div>`}</div></div></div>${footnote()}</div>`}
function videos(){return `<div class="page"><div class="pagehead"><div><div class="eyebrow">MEDIA OUTPUTS</div><h1>Videos</h1><p>Review completed footage, compare attempts, approve or regenerate. Download remains separate from publishing.</p></div></div><div class="grid g3">${V.map(v=>`<div class="card pad"><div class="summary-illustration" style="min-height:175px">${v.emoji}</div><div class="row between" style="margin:13px 0 9px"><b class="small">${esc(v.title)}</b>${pill(v.status)}</div><p class="tiny muted">${esc(v.engine)} · ${esc(P.find(p=>p.id===v.projectId)?.name)}</p><div class="divider"></div>${btn('Review video →','open-video','btn soft','data-id="'+v.id+'" style="width:100%"')}</div>`).join('')}</div>${footnote()}</div>`}
function videoDetail(){const v=vid(),p=P.find(x=>x.id===v.projectId),c=C.find(x=>x.id===v.conceptId);return `<div class="page"><div class="row" style="margin-bottom:18px">${btn(`${ic('arrowleft')} Videos`,'go-videos','btn small ghost')}<span class="tiny muted">/ ${esc(v.title)}</span></div><div class="pagehead"><div><div class="eyebrow">VIDEO REVIEW</div><h1>${esc(v.title)}</h1><p>${esc(v.engine)} · Versioned output from ${esc(p.name)}</p></div><div class="actions">${pill(v.status)}${v.status==='ready'?btn(`${ic('check')} Approve video`,'approve-video','btn primary'):''}${btn(`${ic('refresh')} Regenerate`,'regenerate-video','btn')}</div></div><div class="grid g2" style="align-items:start"><div class="card pad" style="display:flex;justify-content:center;background:linear-gradient(130deg,#f4eeff,#fff4ee)"><div class="video-frame"><span>${v.emoji}</span><b>${esc(v.title)}</b></div></div><div class="stack"><div class="card pad"><div class="section"><h2>Output details</h2></div><div class="kv"><label>Production engine</label><b>${esc(v.engine)}</b></div><div class="kv"><label>Content version</label><b>${c.version}</b></div><div class="kv"><label>Format</label><b>9:16 · MP4</b></div><div class="kv"><label>Provider cost</label><b>${esc(v.cost)}</b></div><div class="kv"><label>Approval</label>${pill(v.status)}</div></div><div class="card pad"><div class="section"><h2>Next action</h2></div><p class="small muted line">${v.approved?'This exact output is approved. You may schedule it for an authorized destination or download it.':'Review the output, approve it or generate another attempt. No public posting occurs automatically.'}</p><div class="actions" style="margin-top:15px">${btn(`${ic('download')} Download`,'download-demo','btn')}${btn(`${ic('calendar')} Schedule`,'go-composer','btn '+(v.approved?'primary':'soft'),v.approved?'':'disabled')}</div></div></div></div>${footnote()}</div>`}
function publishing(){return `<div class="page"><div class="pagehead"><div><div class="eyebrow">DISTRIBUTION</div><h1>Publishing</h1><p>One calendar for your approved videos and connected destinations. Each posting job has explicit authorization.</p></div>${btn(`${ic('plus')} Schedule a video`,'go-composer','btn primary')}</div><div class="grid g2"><div class="card pad"><div class="section"><h2>Upcoming posts</h2><span class="pill">${S.publishing.length} scheduled</span></div>${S.publishing.map(e=>`<div class="listrow"><div class="row"><div class="iconTile">${ic('calendar')}</div><div><b class="small">${esc(e.title)}</b><p class="tiny muted">${esc(e.channel)} · ${esc(e.time)}</p></div></div>${pill(e.status)}</div>`).join('')}</div><div class="card pad"><div class="section"><h2>Connections</h2>${btn('Manage connections →','go-settings','btn ghost small')}</div><div class="listrow"><div class="row"><div class="iconTile peach">${ic('play')}</div><div><b class="small">YouTube</b><p class="tiny muted">Example connected account</p></div></div><span class="pill active">Connected</span></div><div class="listrow"><div class="row"><div class="iconTile">${ic('images')}</div><div><b class="small">Instagram</b><p class="tiny muted">Connect only when publishing</p></div></div><span class="pill off">Not connected</span></div><div class="note" style="margin-top:15px">Projects can have preferred channels, but real publishing is authorized per exact video output, account and schedule.</div></div></div>${footnote()}</div>`}
function composer(){return `<div class="page"><div class="row" style="margin-bottom:17px">${btn(`${ic('arrowleft')} Publishing`,'go-publishing','btn small ghost')}</div><div class="pagehead"><div><div class="eyebrow">PUBLISHING COMPOSER</div><h1>Schedule a video</h1><p>Only approved video attempts are eligible. This simulation never posts to an external platform.</p></div></div><div class="grid g2"><div class="card pad"><div class="stack"><div class="field"><label>Approved video output</label><select id="pub-video">${V.filter(v=>v.approved).map(v=>`<option value="${v.id}">${esc(v.title)} · ${esc(v.engine)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Destination</label><select id="pub-channel"><option>YouTube Shorts</option><option>Instagram Reels · not connected</option></select></div><div class="field"><label>Publication date</label><input id="pub-date" type="date" value="2026-12-02"></div></div><div class="field"><label>Publication time</label><input id="pub-time" type="time" value="09:00"></div><div class="field"><label>Publishing title</label><input id="pub-title" value="A creative short from my Studio"></div>${btn(`${ic('calendar')} Create simulated publishing job`,'save-publishing','btn primary')}</div></div><div class="card pad"><h2 class="font15">Authorization checks</h2><div class="checks" style="margin-top:18px"><div class="checkrow"><span class="checkdot done">${ic('check',13)}</span> Approved video output</div><div class="checkrow"><span class="checkdot done">${ic('check',13)}</span> Connected account required</div><div class="checkrow"><span class="checkdot done">${ic('check',13)}</span> Exact posting time and metadata</div><div class="checkrow"><span class="checkdot">${ic('shield',13)}</span> Final authorization on submit</div></div><div class="note" style="margin-top:18px">Project activation alone cannot publish. The backend rechecks video approval and authorization immediately before each external posting action.</div></div></div>${footnote()}</div>`}
function automation(){return `<div class="page"><div class="pagehead"><div><div class="eyebrow">OPERATIONS</div><h1>Automation</h1><p>Understand what is scheduled, running, paused or stopped without needing to edit raw n8n workflows.</p></div>${btn(`${ic('activity')} Execution history`,'go-runs','btn soft')}</div><div class="grid g3">${P.map(p=>`<div class="card pad"><div class="row between" style="margin-bottom:15px"><div class="row"><div class="iconTile">${ic('bolt')}</div><b class="small">${esc(p.name)}</b></div>${pill(p.status)}</div><div class="kv"><label>Recurring ideation</label><b>${p.automation.ideation?'Configured':'Off'}</b></div><div class="kv"><label>Schedule</label><b>${esc(p.automation.days)}</b></div><div class="kv"><label>Next eligible run</label><b>${p.status==='active'?p.automation.days+' · '+p.automation.time:'On activation/resume'}</b></div>${btn('Manage Project →','open-project','btn soft','data-id="'+p.id+'" style="width:100%;margin-top:18px"')}</div>`).join('')}</div><div class="note" style="margin-top:20px">n8n orchestrates recurring ideation, rendering and publishing. Next.js API enforces permissions, exact content approvals and job safety checks.</div>${footnote()}</div>`}
function runs(){return `<div class="page"><div class="row" style="margin-bottom:16px">${btn(`${ic('arrowleft')} Automation`,'go-automation','btn small ghost')}</div><div class="pagehead"><div><div class="eyebrow">OBSERVABILITY</div><h1>Execution history</h1><p>Durable workflow state with truthful status and recovery information.</p></div></div><div class="card pad"><table class="table"><thead><tr><th>Workflow</th><th>Project</th><th>Result</th><th>Last run</th></tr></thead><tbody>${[['Recurring ideation','Cat Storytelling','Completed','Today · 10:00'],['Video generation','Affiliate Products','Completed','Yesterday · 18:20'],['Publishing','Cat Storytelling','Scheduled','Next Monday'],['Trend research','Cat Storytelling','Awaiting run','Next week']].map(([w,p,s,t])=>`<tr><td><b>${w}</b></td><td>${p}</td><td>${pill(s==='Completed'?'active':s==='Scheduled'?'scheduled':'pending',s)}</td><td>${t}</td></tr>`).join('')}</tbody></table></div>${footnote()}</div>`}
function library(){return `<div class="page"><div class="pagehead"><div><div class="eyebrow">ASSETS</div><h1>Library</h1><p>Reusable project references, generated stills, audio and finished media across your Studio.</p></div>${btn(`${ic('upload')} Upload asset`,'attach','btn soft')}</div><div class="grid g3">${[['🌀','Mini fan product photo','Image · Reference'],['🐈','Cat character reference','Illustration · Series'],['🎨','Project visual palette','Brand Kit · Design'],['🔊','Playful voice preset','Audio · ElevenLabs'],['✳','Motion graphic background','Graphic · Render asset'],['🎬','Generated video clip','Footage · AI provider']].map(([e,t,sub])=>`<div class="card pad"><div class="summary-illustration" style="font-size:50px">${e}</div><h3 style="font-size:14px;margin-top:13px">${t}</h3><div class="tiny muted" style="margin-top:8px">${sub}</div></div>`).join('')}</div>${footnote()}</div>`}
function settings(){return `<div class="page"><div class="pagehead"><div><div class="eyebrow">YOUR STUDIO</div><h1>Settings</h1><p>Manage account security, Telegram linking, provider connections and notification preferences.</p></div></div><div class="tabs">${[['account','Account'],['integrations','Integrations'],['notifications','Notifications'],['budgets','Budgets']].map(([id,n])=>`<button class="tab ${S.settingsTab===id?'active':''}" data-settings-tab="${id}">${n}</button>`).join('')}</div>${S.settingsTab==='account'?`<div class="card pad" style="max-width:700px"><div class="section"><h2>Account</h2></div><div class="kv"><label>Display name</label><b>Studio owner</b></div><div class="kv"><label>Authentication</label><b>Supabase Auth · API-first</b></div><div class="kv"><label>Timezone</label><b>Asia/Jakarta</b></div>${btn('Sign out (demo)','logout-demo','btn soft','style="margin-top:15px"')}</div>`:S.settingsTab==='integrations'?`<div class="grid g2"><div class="card pad"><div class="row between"><div class="row"><div class="iconTile">${ic('chat')}</div><b>Telegram Agent</b></div><span class="pill off">Not linked</span></div><p class="small muted line" style="margin:17px 0">Use the same n8n AI Agent from Telegram and the dashboard after secure identity linking.</p>${btn(`${ic('link')} Link Telegram (demo)`,'link-telegram','btn soft')}</div><div class="card pad"><div class="row between"><div class="row"><div class="iconTile peach">${ic('play')}</div><b>YouTube</b></div><span class="pill active">Connected example</span></div><p class="small muted line" style="margin:17px 0">Connect channels only when needed for authorized publishing.</p>${btn('Manage OAuth connections','connect-demo','btn soft')}</div></div>`:S.settingsTab==='notifications'?`<div class="card pad" style="max-width:700px"><div class="listrow"><div><b>Video review reminders</b><p class="tiny muted">When output is ready to approve.</p></div><input type="checkbox" class="toggle" checked></div><div class="listrow"><div><b>Automation failures</b><p class="tiny muted">Meaningful errors and recovery notices.</p></div><input type="checkbox" class="toggle" checked></div></div>`:`<div class="card pad" style="max-width:700px"><h2 class="font15">Generation budgets</h2><p class="small muted line" style="margin:12px 0">Per-Project limits are visible in Project Automation settings. Production may require additional consent before submitting paid provider jobs.</p></div>`}${footnote()}</div>`}
function login(){return `<div class="page" style="max-width:520px;margin:7vh auto"><div class="card pad" style="padding:32px"><div class="brandmark" style="margin-bottom:20px">${ic('sparkles',24)}</div><div class="eyebrow">WELCOME BACK</div><h1 style="font-size:29px">Sign in to AI Content Studio</h1><p class="small muted" style="margin:11px 0 21px">Prototype sign-in only. Real authentication uses Next.js API and Supabase Auth.</p><div class="stack"><div class="field"><label>Email</label><input type="email" value="creator@example.com"></div><div class="field"><label>Password</label><input type="password" value="prototype"></div>${btn('Sign in (demo)','demo-login','btn primary')}</div></div></div>`}
function chatPanel(){let p=proj(),msgs=getMessages();return `<aside class="agent-panel"><div class="agent-head"><div class="row between"><div class="row"><div class="iconTile">${ic('sparkles')}</div><div><b class="small">Creative Agent</b><p class="tiny muted" style="margin-top:4px">Context: ${esc(p.name)}</p></div></div>${btn(ic('x'),'toggle-agent','icbtn','title="Close Agent"')}</div></div><div class="chatlog" id="chatlog"><div class="bubble agent">I'm here with your ${esc(p.name)} Project. Ask me to change the Creative Kit, propose concepts, adjust schedules, or explain anything.</div>${msgs.map(m=>`<div class="bubble ${m.role==='user'?'user':'agent'}">${esc(m.text)}</div>`).join('')}</div><div class="chatfoot"><div class="chatinput"><textarea id="agent-input" placeholder="Ask about this Project..." aria-label="Message creative agent"></textarea><div class="row between"><span class="tiny muted">Project-linked conversation</span>${btn(ic('send'),'send-agent','btn primary small')}</div></div><div class="tiny muted" style="margin-top:8px">Mock agent responses · No AI requests</div></div></aside>`}
function agent(){if(S.agentStage==='planning')return `<div class="planning"><div class="pagehead"><div><div class="eyebrow">CREATIVE AGENT</div><h1>Preparing your Project</h1><p>Your first message has started planning automatically. The editable Project opens when the plan is ready.</p></div></div><div class="planning-grid"><div class="card pad planning-chat"><div class="section"><h2>Conversation</h2><span class="pill">New idea</span></div><div class="bubble user" style="margin-left:auto">${esc(S.seedMessage)}</div><div class="bubble agent" style="margin-top:20px">I'll develop a Project brief, creative direction, content plan and automation suggestions from your idea.</div></div><div class="card pad"><div class="section"><div><h2>Project preparation</h2><p>Illustrative stage progression, not a real n8n execution.</p></div></div><div class="progressbar" style="margin-bottom:18px"><span style="width:${(S.planningStage+1)*20}%"></span></div><div class="planning-stages">${['Understanding your idea','Planning the content direction','Creating the Creative Kit','Developing concepts and scenes','Preparing automation suggestions'].map((t,i)=>`<div class="planning-step ${i<S.planningStage?'done':i===S.planningStage?'active':''}">${ic(i<S.planningStage?'check':i===S.planningStage?'activity':'clock',17)} ${t}</div>`).join('')}</div></div></div></div>`;return `<div class="agent-start"><div class="bigmark">${ic('sparkles',30)}</div><h1>What would you like to <span style="color:var(--accent)">create?</span></h1><p>Start with a goal, a rough idea, a product photo or a story. I'll prepare a draft Project automatically—you can edit every detail later.</p><div class="agent-composer"><textarea id="new-agent-input" placeholder="I want to create a short video about..."></textarea><div class="row between">${btn(`${ic('plus')} Add reference`,'attach','btn ghost small')}${btn(`${ic('send')} Send`,'send-agent-new','btn primary')}</div></div><div class="quickprompts" style="justify-content:center;margin-top:20px"><button class="prompt" data-prompt="I want to create affiliate content for home products">Affiliate products</button><button class="prompt" data-prompt="Start a funny cat storytelling series">Cat storytelling</button><button class="prompt" data-prompt="Create a mini fan product promo from a reference">One product video</button></div></div>`}
function modal(){if(!S.modal)return '';const p=proj(),c=concept();if(S.modal==='edit-project')return `<div class="overlay" data-close-overlay="1"><div class="modal"><div class="row between"><h2>Edit Project</h2>${btn(ic('x'),'close-modal','icbtn')}</div><p>These settings apply to every Project status. Editing doesn't start automation.</p><div class="stack" style="margin-top:22px"><div class="field"><label>Project name</label><input id="edit-project-name" value="${esc(p.name)}"></div><div class="field"><label>Project objective</label><textarea id="edit-project-goal">${esc(p.goal)}</textarea></div><div class="actions" style="justify-content:flex-end">${btn('Cancel','close-modal','btn')}${btn('Save changes','save-project','btn primary')}</div></div></div></div>`;
if(S.modal==='edit-concept')return `<div class="overlay" data-close-overlay="1"><div class="modal"><div class="row between"><h2>Edit content concept</h2>${btn(ic('x'),'close-modal','icbtn')}</div><p>Saving changes to an approved concept creates a new draft version. Previous generated outputs keep their original approved snapshot.</p><div class="stack" style="margin-top:21px"><div class="field"><label>Title</label><input id="edit-concept-name" value="${esc(c.title)}"></div><div class="field"><label>Hook</label><input id="edit-concept-hook" value="${esc(c.hook)}"></div><div class="field"><label>Story brief</label><textarea id="edit-concept-summary">${esc(c.summary)}</textarea></div><div class="field"><label>Voice-over script · one line per scene</label><textarea id="edit-concept-script">${esc(c.script.join('\n'))}</textarea></div><div class="actions" style="justify-content:flex-end">${btn('Cancel','close-modal','btn')}${btn('Save new version','save-concept','btn primary')}</div></div></div></div>`;
if(S.modal==='activate'){const items=launch(p.id);return `<div class="overlay" data-close-overlay="1"><div class="modal"><div class="row between"><h2>Activate ${esc(p.name)}?</h2>${btn(ic('x'),'close-modal','icbtn')}</div><p>You're accepting this Project configuration and enabling only its selected recurring automations.</p><div class="note" style="margin:20px 0"><div class="kv"><label>Initial launch content</label><b>${items.length} approved</b></div><div class="kv"><label>Recurring ideation</label><b>${p.automation.ideation?p.automation.days+' · '+p.automation.time:'Off'}</b></div><div class="kv"><label>Scheduled publishing</label><b>${p.automation.publishing?'Configured':'Off'}</b></div><div class="kv"><label>Paid generation</label><b>Separate consent</b></div><div class="kv"><label>External publishing</label><b>Separate authorization</b></div></div><div class="note amber">Activation does not automatically render every approved concept or post videos. Those actions retain their own permissions and cost controls.</div><div class="actions" style="justify-content:flex-end;margin-top:20px">${btn('Cancel','close-modal','btn')}${btn(`${ic('play')} Activate Project`,'confirm-activate','btn primary')}</div></div></div>`}
return `<div class="overlay"><div class="modal"><div class="row between"><h2>Notice</h2>${btn(ic('x'),'close-modal','icbtn')}</div></div></div>`}
function render(){const focus=['agent'].includes(S.route),hasAgent=S.agentOpen&&['project','detail','production','video-detail'].includes(S.route);let primary=({overview,projects,project,content,detail:contentDetail,production,videos,'video-detail':videoDetail,publishing,composer,automation,runs,library,settings,login,agent}[S.route]||overview)();let center=hasAgent?`<div class="mobile-switch">${btn('Chat','mobile-chat','btn small '+(S.mobilePane==='chat'?'soft':''))}${btn(S.route==='detail'?'Content details':'Project','mobile-project','btn small '+(S.mobilePane==='project'?'soft':''))}</div><div class="workspace mobile-${S.mobilePane}">${chatPanel()}<main class="workspace-main">${primary}</main></div>`:primary;let html=`<div class="shell">${nav()}<div class="app">${topbarUI()}${center}</div></div>${drawer()}${modal()}<div id="toast" class="toast hidden" role="status"></div>`;document.getElementById('root').innerHTML=html;if(hasAgent){const l=document.getElementById('chatlog');if(l)l.scrollTop=l.scrollHeight}}
let toastTimer;function toast(msg){let e=document.getElementById('toast');if(!e)return;e.textContent=msg;e.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{const b=document.getElementById('toast');if(b)b.classList.add('hidden')},3100)}
function go(route){S.route=route;S.drawer=false;S.search='';if(!['project','detail','production','video-detail'].includes(route))S.agentOpen=false;if(!['agent','project','detail','production','video-detail'].includes(route))S.sidebar=true;render();window.scrollTo(0,0)}

function openConcept(id){let c=C.find(x=>x.id===id);if(!c)return;S.conceptId=id;S.projectId=c.projectId;S.contentTab='storyboard';S.agentOpen=false;S.sidebar=true;S.mobilePane='project';go('detail')}
function openVideo(id){let v=V.find(x=>x.id===id);if(!v)return;S.videoId=id;S.projectId=v.projectId;S.conceptId=v.conceptId;S.agentOpen=false;S.sidebar=true;go('video-detail')}
function addConversation(role,text,id=S.projectId){(S.agentMessages[id]??=[]).push({role,text})}
function newProjectFromIdea(msg){let low=msg.toLowerCase();let cat=/cat|kitten|pet/i.test(msg),aff=/affiliate|product|promotion|fan/i.test(msg),dev=/developer|code|programming|software/i.test(msg);let name=cat?'Cat Story Concepts':aff?'Affiliate Creative Plan':dev?'Developer Shorts':msg.length<30?msg.replace(/^i want to (create|make) /i,'').slice(0,30):'My Creative Project';const id='p'+(P.length+1),cid='c'+(C.length+1),p={id,name,goal:msg,status:'draft',kind:cat?'Story series':aff?'Product content':dev?'Education':'Creative content',cover:cat?'lavender':aff?'peach':dev?'dark':'mint',emoji:cat?'🐈':aff?'✳':dev?'⌘':'✨',kit:{language:'Indonesian',tone:cat?'Witty':'Playful',audience:cat?'Pet owners':aff?'Everyday shoppers':'General audience',objective:cat?'Entertain':aff?'Promote':'Educate',structure:cat?'Connected series':'Independent content',visual:cat?'Illustrated / animated':'Modern product design',details:'AI-prepared creative direction. Edit the options or ask the agent to adjust them.'},automation:{ideation:true,publishing:false,days:'Monday & Friday',time:'09:00',budget:12},created:'Just now'};P.unshift(p);C.unshift({id:cid,projectId:id,title:cat?'The curious cat adventure':aff?'One everyday product, one fun story':dev?'The first backend concept':`Content idea: ${msg.slice(0,38)}`,summary:msg,hook:cat?'What did the cat discover today?':aff?'A little upgrade for your day':'Here is a simple idea worth sharing.',status:'pending',version:1,launch:true,emoji:cat?'🐈':aff?'🛍️':dev?'⌘':'✨',script:['Here is the opening hook.','The main idea develops with visuals and narration.','A clear, memorable closing moment.'],scenes:[],publish:{title:name+' — first short',description:'Content plan prepared from the creator’s original idea.',hashtags:'#CreativeContent #ShortVideo'}});S.agentMessages[id]=[{role:'user',text:msg},{role:'agent',text:`I prepared ${name} as a Draft Project. Its goal, Creative Kit, content concept and automation suggestions are editable in the tabs on the right.`}];S.projectId=id;S.conceptId=cid;S.projectTab='overview';S.agentStage='ready';S.agentOpen=true;S.sidebar=false;S.mobilePane='project';S.route='project';render();window.scrollTo(0,0);toast('Draft Project prepared. Open any tab to review or edit.')}
function startPlanning(msg){msg=(msg||'').trim();if(!msg){toast('Describe an idea to begin.');return;}S.seedMessage=msg;S.agentStage='planning';S.planningStage=0;S.agentOpen=false;S.sidebar=false;S.route='agent';let ticket=++S.planningTicket;render();window.scrollTo(0,0);for(let i=1;i<=4;i++)setTimeout(()=>{if(S.planningTicket!==ticket)return;S.planningStage=i;render();},i*620);setTimeout(()=>{if(S.planningTicket!==ticket)return;newProjectFromIdea(msg)},3250)}
function agentSend(){let el=document.getElementById('agent-input');const msg=el?.value.trim();if(!msg)return;const p=proj(),lower=msg.toLowerCase();addConversation('user',msg);if(/(tone|make it|change to|style)/.test(lower)&&(lower.includes('witty')||lower.includes('playful')||lower.includes('professional')||lower.includes('calm'))){let v=['witty','playful','professional','calm'].find(k=>lower.includes(k));p.kit.tone=v[0].toUpperCase()+v.slice(1);addConversation('agent',`I updated this Project's tone to ${p.kit.tone}. Future content will use it; approved versions stay unchanged.`)}else if(/add.*(idea|concept)|another.*(idea|concept)/.test(lower)){let id='c'+(C.length+1);C.push({id,projectId:p.id,title:'New concept from conversation',summary:msg,hook:'A fresh idea to explore.',status:'pending',version:1,launch:false,emoji:'✨',script:['A new idea begins.','A scene to develop.','A closing moment.'],scenes:[],publish:{title:'New concept',description:'From the Agent conversation.',hashtags:'#CreativeIdeas'}});addConversation('agent',`I added a new draft concept to ${p.name}. It isn't selected for initial launch or approved yet.`)}else if(/schedule|monday|wednesday|friday/.test(lower)){p.automation.days=lower.includes('wednesday')?'Wednesday':lower.includes('monday')&&lower.includes('friday')?'Monday & Friday':lower.includes('monday')?'Monday':p.automation.days;addConversation('agent',`I updated the proposed ideation schedule to ${p.automation.days}. Automation remains governed by Project status and permissions.`)}else addConversation('agent',`I can help refine ${p.name}. In the real product, our shared n8n agent will understand open-ended requests; here you can try “make the tone witty”, “add another concept”, or “change schedule to Monday”.`);render();}
function doAction(a,button){let p=proj(),c=concept();switch(a){case 'toggle-sidebar':if(window.innerWidth<=850||S.route==='agent'){S.drawer=!S.drawer}else{S.sidebar=!S.sidebar;S.drawer=false;}render();break;
case 'toggle-drawer':S.drawer=!S.drawer;render();break;
case 'toggle-agent':S.agentOpen=!S.agentOpen;if(S.agentOpen){S.sidebar=false;S.mobilePane='chat'}else{S.sidebar=true;S.mobilePane='project'}render();break;
case 'new-chat':S.agentStage='start';S.seedMessage='';S.planningTicket++;S.agentOpen=false;S.sidebar=false;go('agent');break;
case 'send-overview':startPlanning(document.getElementById('overview-message')?.value);break;
case 'send-agent-new':startPlanning(document.getElementById('new-agent-input')?.value);break;
case 'send-agent':agentSend();break;
case 'mobile-chat':S.mobilePane='chat';render();break;case 'mobile-project':S.mobilePane='project';render();break;
case 'overview-new':S.overviewNew=true;render();break;case 'overview-active':S.overviewNew=false;render();break;
case 'open-p1':openProject('p1');break;case 'open-c2':openConcept('c2');break;case 'open-v1':openVideo('v1');break;
case 'go-overview':go('overview');break;case 'go-projects':go('projects');break;case 'go-content':go('content');break;case 'go-videos':go('videos');break;case 'go-publishing':go('publishing');break;case 'go-composer':go('composer');break;case 'go-automation':go('automation');break;case 'go-runs':go('runs');break;case 'go-settings':go('settings');break;
case 'project-content':S.projectTab='content';render();break;case 'project-kit':S.projectTab='kit';render();break;case 'project-automation':S.projectTab='automation';render();break;
case 'back-project-content':S.projectTab='content';openProject(p.id);S.projectTab='content';render();break;
case 'go-detail':S.contentTab='storyboard';go('detail');break;case 'tab-script':S.contentTab='script';render();break;case 'tab-storyboard':S.contentTab='storyboard';render();break;case 'go-production':if(c.status!=='approved'){toast('Approve this exact concept version before video production.');break;}S.productionMode='remotion';go('production');break;
case 'open-concept':openConcept(button.dataset.id);break;case 'open-video':openVideo(button.dataset.id);break;case 'open-project':openProject(button.dataset.id);break;
case 'edit-project':S.modal='edit-project';render();break;case 'save-project':{let n=document.getElementById('edit-project-name')?.value.trim(),g=document.getElementById('edit-project-goal')?.value.trim();if(!n){toast('Project name is required.');break;}p.name=n;p.goal=g||p.goal;S.modal=null;render();toast('Project details updated.');break;}
case 'close-modal':S.modal=null;render();break;
case 'save-kit':{for(const f of ['language','tone','audience','objective','structure','visual']){const el=document.querySelector(`[data-kit="${f}"]`);if(el)p.kit[f]=el.value;}p.kit.details=document.getElementById('kit-details')?.value||'';render();toast('Creative Kit saved. Approved concept snapshots are unchanged.');break;}
case 'save-automation':p.automation.days=document.querySelector('[data-kit="autodays"]')?.value||p.automation.days;p.automation.time=document.getElementById('autotime')?.value||p.automation.time;p.automation.budget=Math.max(0,Number(document.getElementById('autobudget')?.value||0));render();toast(p.status==='draft'?'Automation proposal saved; Draft Projects do not execute it.':'Automation preferences updated locally.');break;
case 'add-concept':{let id='c'+(C.length+1);C.push({id,projectId:p.id,title:'New content concept',summary:'A new editable content idea.',hook:'Your opening line here.',status:'pending',version:1,launch:false,emoji:'✨',script:['Opening narration','Main story narration','Closing narration'],scenes:[],publish:{title:'New content concept',description:'Short video concept.',hashtags:'#CreativeContent'}});openConcept(id);toast('New concept created as a draft.');break;}
case 'edit-concept':S.modal='edit-concept';render();break;
case 'save-concept':{let name=document.getElementById('edit-concept-name')?.value.trim();if(!name){toast('Content title is required.');break;}c.title=name;c.hook=document.getElementById('edit-concept-hook')?.value.trim()||c.hook;c.summary=document.getElementById('edit-concept-summary')?.value.trim()||c.summary;const scr=document.getElementById('edit-concept-script')?.value.trim().split('\n').map(s=>s.trim()).filter(Boolean);if(scr.length)c.script=scr;c.version+=1;c.status='pending';c.scenes=[];S.modal=null;render();toast('New draft version saved. Previous approved versions and outputs stay intact.');break;}
case 'approve-concept':c.status='approved';render();toast('Content version approved. Production still requires generation authorization.');break;
case 'activate-project':if(p.status!=='draft'){toast('Project activation is for Draft Projects.');break;}if(!eligible(p.id)){S.projectTab='content';render();toast('Approve all selected launch concepts before activation.');break;}S.modal='activate';render();break;
case 'confirm-activate':p.status='active';S.modal=null;render();toast('Project activated. Enabled automation may run when due; publishing and paid media stay separately authorized.');break;
case 'pause-project':p.status='paused';render();toast('Project paused. Future automatic claims are held.');break;
case 'resume-project':p.status='active';render();toast('Project resumed. Missed jobs are not automatically released.');break;
case 'stop-project':p.status='stopped';render();toast('Project automation stopped. Your content remains saved.');break;
case 'generate-video':if(c.status!=='approved'){toast('Approve the content first.');break;}let engine={remotion:'Remotion',fal:S.model==='kling'?'fal.ai · Kling':'fal.ai · MiniMax',hybrid:'Hybrid'}[S.productionMode];let newV={id:'v'+(V.length+1),conceptId:c.id,projectId:p.id,engine,status:'generating',approved:false,cost:S.productionMode==='remotion'?'—':'Illustrative estimate',emoji:c.emoji,title:c.title};V.unshift(newV);S.videoId=newV.id;toast('Simulating generation; no provider request or charge.');render();setTimeout(()=>{if(newV.status==='generating'){newV.status='ready';openVideo(newV.id);toast('Simulated output ready for review.')}},1600);break;
case 'approve-video':vid().approved=true;vid().status='approved';render();toast('Exact video attempt approved. Publishing still requires explicit authorization.');break;
case 'regenerate-video':S.projectId=vid().projectId;S.conceptId=vid().conceptId;S.productionMode='remotion';go('production');break;
case 'download-demo':toast('No real MP4 is attached to this interface prototype.');break;
case 'save-publishing':{let id=document.getElementById('pub-video')?.value,v=V.find(v=>v.id===id);if(!v||!v.approved){toast('Select an approved video output.');break;}let channel=document.getElementById('pub-channel')?.value||'YouTube Shorts';if(channel.includes('not connected')){toast('This destination is not connected.');break;}let title=document.getElementById('pub-title')?.value||v.title,date=document.getElementById('pub-date')?.value||'2026-12-02',time=document.getElementById('pub-time')?.value||'09:00';S.publishing.unshift({title,projectId:v.projectId,time:date+' · '+time,status:'scheduled',channel});go('publishing');toast('Simulated publishing job created. No external upload occurred.');break;}
case 'filter-all':S.search='';render();break;case 'filter-pending':S.search='';toast('Browse concepts requiring approval in the content cards.');break;case 'filter-approved':toast('Approved concepts are marked green.');break;
case 'attach':toast('File uploads are not connected in this static prototype.');break;case 'link-telegram':toast('Telegram account linking is planned through a secure challenge in the Next.js API.');break;case 'connect-demo':toast('OAuth is not connected in this static prototype.');break;case 'notifications':toast('No real notifications in this design preview.');break;
case 'logout-demo':S.auth=false;go('login');break;case 'demo-login':S.auth=true;go('overview');toast('Demo sign-in completed; no authentication request was made.');break;
case 'noop':break;
default:toast('This is a design preview.');}}
window.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-go],[data-open-project],[data-project-tab],[data-content-tab],[data-settings-tab],[data-mode],[data-prompt]');if(!el)return;if(el.dataset.go){S.drawer=false;go(el.dataset.go);return;}if(el.dataset.openProject){openProject(el.dataset.openProject);return;}if(el.dataset.projectTab){S.projectTab=el.dataset.projectTab;render();return;}if(el.dataset.contentTab){S.contentTab=el.dataset.contentTab;render();return;}if(el.dataset.settingsTab){S.settingsTab=el.dataset.settingsTab;render();return;}if(el.dataset.mode){S.productionMode=el.dataset.mode;render();return;}if(el.dataset.prompt){startPlanning(el.dataset.prompt);return;}if(el.dataset.action){doAction(el.dataset.action,el);return;}});
window.addEventListener('change',e=>{const el=e.target;if(el.dataset.launch){const c=C.find(c=>c.id===el.dataset.launch);if(c){c.launch=el.checked;render();toast(c.launch?'Selected for the initial launch.':'Kept as an ordinary draft or approved content item.');}return;}if(el.dataset.automation){proj().automation[el.dataset.automation]=el.checked;render();toast('Automation preference updated. This is not an activation.');return;}if(el.id==='video-model'){S.model=el.value;return;}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.modal){S.modal=null;render();return;}if(S.drawer){S.drawer=false;render();return;}}if(e.key==='Enter'&&!e.shiftKey&&['overview-message','new-agent-input','agent-input'].includes(e.target.id)){e.preventDefault();if(e.target.id==='overview-message'||e.target.id==='new-agent-input')startPlanning(e.target.value);else agentSend();}});
window.addEventListener('resize',()=>{if(window.innerWidth>850&&S.drawer){S.drawer=false;render();}});
render();
</script></body></html>

services:
  n8n:
    image: n8nio/n8n:1.109.1
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=development
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-local-dev-only-change-me}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Point workflows at the Next.js internal API
      - ACS_API_BASE_URL=${ACS_API_BASE_URL:-http://host.docker.internal:3000}
      - ACS_INTERNAL_SERVICE_TOKEN=${ACS_INTERNAL_SERVICE_TOKEN:-local-internal-token-change-me}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
